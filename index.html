/* ════════════════════════════════════════
   ① DataCloneError / UnhandledRejection を
      アプリ外（Claudeプレビュー等）に漏らさない
      ─ fetch の内部エラーがpostMessageに届く前に止める ─
════════════════════════════════════════ */
window.addEventListener('error', function(ev) {
  if (ev && ev.message && ev.message.includes('DataCloneError')) {
    ev.preventDefault(); ev.stopImmediatePropagation(); return false;
  }
}, true);
window.addEventListener('unhandledrejection', function(ev) {
  try {
    var r = ev.reason;
    var msg = (r instanceof Error) ? r.message : String(r || '');
    if (msg.includes('DataCloneError') || msg.includes('postMessage') ||
        msg.includes('cloned') || msg.includes('Headers')) {
      ev.preventDefault(); ev.stopImmediatePropagation(); return false;
    }
  } catch(_) {}
}, true);

  return{iso,disp:`${y}年${mo}月${d}日（${w}）`};

function cleanUrl(raw){
  return(raw||'').trim().replace(/\r?\n|\s/g,'').replace(/\/rest\/v1.*$/,'').replace(/\/+$/,'').replace(/^http:\/\//,'https://').replace(/^(?!https?:\/\/)/,'https://');
}

/* ══════════════════════════════════════════
   安全なエラー文字列変換（DataCloneError対策）
══════════════════════════════════════════ */
function safeMsg(err){
  if(!err)return'不明なエラー';
  if(typeof err==='string')return err;
  if(err instanceof Error)return err.message||String(err);
  if(typeof err==='object'){
    const m=err.message||err.hint||err.details||err.error_description||err.error||'';
    if(m&&typeof m==='string')return m;
    try{return JSON.stringify(err);}catch(_){}
  }
  try{return String(err);}catch(_){return'不明なエラー';}
}

function jp(input){
  const msg=typeof input==='string'?input:safeMsg(input);
  if(!msg)return'原因不明のエラーです。';
  if(msg.includes('Failed to fetch')||msg.includes('NetworkError'))
    return'通信エラー（Failed to fetch）\nVercelで公開したURLで開いてください。\nlocalhost/ファイルからは接続できません。';
  if(msg.includes('401')||msg.includes('invalid_jwt')||msg.includes('Invalid API key'))
    return'Anon Keyが正しくありません（401）\nSupabase > Settings > API の「anon public」を確認してください。';
  if(msg.includes('403')||msg.includes('permission denied')||msg.includes('row-level security'))
    return'RLSポリシーエラー（403）\nsupabase_v2.sql を再実行してポリシーを設定してください。';
  if(msg.includes('does not exist')||msg.includes('relation')||msg.includes('404'))
    return'テーブルが存在しません。\nSupabase > SQL Editor で supabase_v2.sql を実行してください。';
  return`エラー: ${msg}`;
}

/* ══════════════════════════════════════════
   Supabase REST API クライアント（純粋fetchベース）
   ── window.supabase.createClient を使わない ──
   Headers/Response/Requestオブジェクトをstateに保存しないため
   DataCloneErrorが発生しない
══════════════════════════════════════════ */

// 接続情報をプリミティブ値で保持（オブジェクトではない）
let _sbUrl = '';
let _sbKey = '';

// SupabaseのREST APIを直接fetchで叩くクライアント
const SB = {
  from(table) { return new SBQuery(table); }
};

class SBQuery {
  constructor(table) {
    this._t  = table;
    this._f  = [];      // フィルター配列
    this._ord = null;
    this._lim = null;
    this._m   = 'GET';  // HTTP method
    this._bdy = null;   // request body
    this._sel = '*';    // select columns
    this._retRep = true;// Prefer: return=representation
  }

  // ── チェーンメソッド ──
  select(cols)         { this._sel = cols || '*'; return this; }
  eq(col, val)         { this._f.push(col + '=eq.' + encodeURIComponent(String(val))); return this; }
  lt(col, val)         { this._f.push(col + '=lt.' + val); return this; }
  lte(col, val)        { this._f.push(col + '=lte.' + val); return this; }
  gte(col, val)        { this._f.push(col + '=gte.' + val); return this; }
  in(col, vals)        { this._f.push(col + '=in.(' + vals.map(String).join(',') + ')'); return this; }
  order(col, opts)     { this._ord = col + '.' + ((opts && opts.ascending === false) ? 'desc' : 'asc'); return this; }
  limit(n)             { this._lim = n; return this; }

  // INSERT: POST。引数が配列なら一括、オブジェクトなら単件
  insert(data)         { this._m = 'POST'; this._bdy = data; this._sel = null; return this; }
  // UPDATE: PATCH
  update(data)         { this._m = 'PATCH'; this._bdy = data; return this; }
  // DELETE: DELETE
  delete()             { this._m = 'DELETE'; this._bdy = null; return this; }
  // insert/update後にselect()するとreturn=representationで挿入/更新後のデータを返す
  // ただしselectはURLクエリ（GETのみ）ではなく、POSTでもPrefer: return=representationで代用
  // select() をPOST/PATCH後に呼んだ場合は「返却カラム指定」とみなす
  // （Supabase REST は POST ?select=* で返却カラムを指定できる）

  // Promiseとして評価
  then(resolve, reject) {
    this._exec().then(resolve).catch(function(e) {
      // 絶対にErrorオブジェクトをrejectに渡さない
      var msg = (e instanceof Error) ? e.message : String(e || 'エラー');
      resolve({ data: null, error: { message: msg } });
    });
  }

  async _exec() {
    if (!_sbUrl || !_sbKey) {
      return { data: null, error: { message: 'Supabase未接続。設定画面でURL/Keyを入力してください。' } };
    }

    // ── URLクエリ文字列の組み立て ──
    var parts = [];
    // フィルター
    this._f.forEach(function(f) { parts.push(f); });
    // ORDER / LIMIT はGETだけでなくPATCH/DELETEにも有効
    if (this._ord) parts.push('order=' + this._ord);
    if (this._lim) parts.push('limit=' + this._lim);
    // SELECT カラム指定
    // GETなら必ずselect=を付ける
    // POST/PATCHの場合、insert().select()のように呼ばれたとき _sel が設定されている
    // → URLに select= を付けると返却カラムを指定できる（Supabase REST仕様）
    if (this._sel) {
      parts.push('select=' + this._sel);
    }

    var qs  = parts.length ? '?' + parts.join('&') : '';
    var url = _sbUrl + '/rest/v1/' + this._t + qs;

    // Prefer ヘッダー
    // POST: return=representation → 挿入後のレコードを返す
    // PATCH: return=representation → 更新後のレコードを返す
    // DELETE: return=representation → 削除されたレコードを返す（必要に応じて）
    var prefer = 'return=representation';

    var fetchResult = await safeFetch(url, {
      method:  this._m,
      headers: {
        'Content-Type':  'application/json',
        'apikey':        _sbKey,
        'Authorization': 'Bearer ' + _sbKey,
        'Prefer':        prefer,
      },
      body: this._bdy != null ? JSON.stringify(this._bdy) : undefined,
    });

    // ネットワークエラー
    if (fetchResult.errMsg) {
      return { data: null, error: { message: fetchResult.errMsg } };
    }

    // HTTPエラー
    if (!fetchResult.ok) {
      var errMsg = 'HTTP ' + fetchResult.status;
      try {
        var j = JSON.parse(fetchResult.body);
        var detail = j.message || j.hint || j.details || j.error || '';
        if (detail) errMsg += ': ' + detail;
      } catch (_) {}
      return { data: null, error: { message: String(errMsg) } };
    }

    // 成功 → bodyをパース
    var data = [];
    try {
      var parsed = fetchResult.body ? JSON.parse(fetchResult.body) : null;
      if (parsed === null) {
        data = [];
      } else if (Array.isArray(parsed)) {
        data = parsed;
      } else {
        data = [parsed];
      }
    } catch (_) { data = []; }

    return { data: data, error: null };
  }
}

/* ══════════════════════════════════════════
   安全なfetchラッパー
   DataCloneError / ネットワークエラーを必ず
   { ok, status, body, errMsg } の純粋オブジェクトに変換する
   ─ Responseオブジェクトを絶対に外に漏らさない ─
══════════════════════════════════════════ */
async function safeFetch(url, options) {
  // 戻り値は常にプレーンオブジェクト（cloneableな値のみ）
  var result = { ok: false, status: 0, body: '', errMsg: '' };
  try {
    // fetchを呼ぶ
    var resp;
    try {
      resp = await fetch(url, options);
    } catch (netErr) {
      // ネットワーク到達不可（Failed to fetch など）
      result.errMsg = (netErr instanceof Error) ? netErr.message
                    : typeof netErr === 'string' ? netErr
                    : 'ネットワークエラー';
      return result;
    }

    // status だけを数値として取り出す
    result.status = resp.status;
    result.ok = resp.ok;

    // bodyをテキストとして読む（Responseオブジェクトは変数に保存しない）
    try { result.body = await resp.text(); } catch (_) { result.body = ''; }

    // Responseオブジェクト resp はここで自然にGCされる
    return result;

  } catch (unexpected) {
    // DataCloneError を含む予期しないエラーを全て捕捉
    result.errMsg = (unexpected instanceof Error) ? unexpected.message
                  : typeof unexpected === 'string' ? unexpected
                  : '予期しないエラー';
    return result;
  }
}

/* ══════════════════════════════════════════
   Supabase 初期化（fetchベース・DataCloneError完全防止）
   createClient を使わない
   fetch の戻り値（Response/Headers）をstateに保存しない
══════════════════════════════════════════ */
let isReady = false;

async function initSB(url, key) {
  var u = cleanUrl(url);
  var k = (key || '').trim().replace(/\s/g, '');
  if (!u || !k) return { ok: false, errorMsg: 'URLとAnon Keyを入力してください' };

  // ── 接続テスト：safeFetchでstoresを1件取得 ──
  var testResult = await safeFetch(
    u + '/rest/v1/stores?select=id%2Cname&limit=1',
    {
      method: 'GET',
      headers: {
        'Content-Type':  'application/json',
        'apikey':        k,
        'Authorization': 'Bearer ' + k,
      },
    }
  );

  // ネットワークエラー
  if (testResult.errMsg) {
    return { ok: false, errorMsg: testResult.errMsg };
  }

  // HTTPエラー（文字列のみ使用）
  if (testResult.status === 401) return { ok: false, errorMsg: 'HTTP 401: Anon Keyが正しくありません。\nSupabase > Settings > API の「anon public」を確認してください。' };
  if (testResult.status === 403) {
    var hint403 = '';
    try { hint403 = JSON.parse(testResult.body).hint || ''; } catch (_) {}
    return { ok: false, errorMsg: 'HTTP 403: RLSポリシーエラー。\nsupabase_v2.sql を再実行してください。' + (hint403 ? '\n' + hint403 : '') };
  }
  if (testResult.status === 404) return { ok: false, errorMsg: 'HTTP 404: storesテーブルが存在しません。\nSQL Editorでテーブルを作成してください。' };
  if (testResult.status >= 400) {
    var msg4xx = 'HTTP ' + testResult.status;
    try { var j4xx = JSON.parse(testResult.body); msg4xx += ': ' + (j4xx.message || j4xx.error || ''); } catch (_) {}
    return { ok: false, errorMsg: msg4xx };
  }
  if (testResult.status !== 200) return { ok: false, errorMsg: 'HTTP ' + testResult.status + ': 予期しないレスポンス' };

  // ── 接続成功 ──
  // プリミティブ文字列としてのみ保存（Responseオブジェクト不使用）
  _sbUrl  = u;
  _sbKey  = k;
  isReady = true;

  // storeNamesを文字列として取り出す
  var storeNames = '';
  try {
    var rows = JSON.parse(testResult.body);
    if (Array.isArray(rows)) storeNames = rows.map(function(s){ return s.name || ''; }).join('、');
  } catch (_) {}

  // マスターデータをロード（エラーが出ても続行）
  await _loadMaster();

  return { ok: true, storeNames: storeNames };
}

// マスターデータ（stores/categories/products/PSV）を取得
async function _loadMaster() {
  var h={'Content-Type':'application/json','apikey':_sbKey,'Authorization':'Bearer '+_sbKey};
  // stores（safeFetch直接使用でSBQueryのthen問題を回避）
  try {
    var rs=await safeFetch(_sbUrl+'/rest/v1/stores?select=*&is_active=eq.true&order=display_order.asc&limit=100',{method:'GET',headers:h});
    if(!rs.errMsg&&rs.ok){
      var ds=JSON.parse(rs.body||'[]');
      if(Array.isArray(ds)&&ds.length>0){STORES=ds;}
      else{
        var rs2=await safeFetch(_sbUrl+'/rest/v1/stores?select=*&order=display_order.asc&limit=100',{method:'GET',headers:h});
        if(!rs2.errMsg&&rs2.ok){var ds2=JSON.parse(rs2.body||'[]');if(Array.isArray(ds2)&&ds2.length>0)STORES=ds2;}
      }
    }
  } catch (_) {}

  // categories
  try {
    const r = await SB.from('categories').select('*').eq('is_active', true).order('display_order').limit(100);
    if (!r.error && r.data && r.data.length > 0) CATS = r.data;
    else {
      const r2 = await SB.from('categories').select('*').limit(100);
      if (!r2.error && r2.data && r2.data.length > 0) CATS = r2.data;
    }
  } catch (_) {}

  // products
  try {
    const r = await SB.from('products').select('*').order('display_order').limit(1000);
    if (!r.error && r.data) PRODUCTS = r.data;
  } catch (_) {}

  // PSV
  try {
    const r = await SB.from('product_store_visibility').select('product_id,store_id,is_visible').limit(5000);
    if (!r.error && r.data) {
      PSV = {};
      r.data.filter(row => row.is_visible).forEach(row => {
        if (!PSV[row.product_id]) PSV[row.product_id] = [];
        PSV[row.product_id].push(row.store_id);
      });
    }
  } catch (_) {}
}

// 店舗向けの商品リスト（PSVがあれば絞り込む、なければ全部）
function productsForStore(storeId){
  const sid=Number(storeId);
  const hasPSV=Object.keys(PSV).length>0;
  if(!hasPSV)return PRODUCTS.filter(p=>p.is_active!==false);
  return PRODUCTS.filter(p=>{
    if(p.is_active===false)return false;
    const vis=PSV[p.id]||PSV[String(p.id)];
    if(!vis||vis.length===0)return true; // PSV未設定なら全店舗に表示
    return vis.some(v=>Number(v)===sid);
  });
}

/* ── 接続テスト（完全防御版） ── */
async function doTest(){
  var box=$('cst');
  if(!box)return;
  var rawU,rawK;
  try{rawU=($('sb-url').value||'').trim();}catch(_){rawU='';}
  try{rawK=($('sb-key').value||'').trim();}catch(_){rawK='';}
  if(!rawU||!rawK){box.innerHTML=cBox('e','URLとAnon Keyの両方を入力してください');return;}
  var u=cleanUrl(rawU);
  var k=rawK.replace(/\s/g,'');
  if(!u.match(/^https:\/\/[a-z0-9-]+\.supabase\.co$/i)){
    box.innerHTML=cBox('e','URLの形式が正しくありません\n正しい形式: https://xxxxx.supabase.co');return;
  }
  if(!k.startsWith('eyJ')){
    box.innerHTML=cBox('e','Anon Keyは「eyJ」で始まる文字列を入力してください');return;
  }
  try{$('sb-url').value=u;}catch(_){}
  box.innerHTML='<div class="cbox cif"><div class="sp spsm"></div><span>接続テスト中…（Vercel公開URLのみ対応）</span></div>';

  // initSBは必ず {ok, errorMsg or storeNames} を返す（例外を投げない）
  var r;
  try{r=await initSB(u,k);}
  catch(unexpected){
    // initSBが万が一throwした場合も安全に処理
    var unexpectedMsg='接続処理中にエラーが発生しました';
    try{if(unexpected instanceof Error)unexpectedMsg=unexpected.message;}catch(_){}
    box.innerHTML=cBox('e',unexpectedMsg);
    return;
  }

  if(r&&r.ok){
    // 成功時はlocalStorageに保存
    try{localStorage.setItem('supabase_url',u);}catch(_){}
    try{localStorage.setItem('supabase_anon_key',k);}catch(_){}
    try{localStorage.setItem('supabase_connected','true');}catch(_){}
    sCfg(u,k);
    var goBtn=$('go-btn');
    if(goBtn)goBtn.disabled=false;
    var names=r.storeNames||'storesテーブル確認済み';
    box.innerHTML=cBox('ok','Supabase接続に成功しました ✓\n接続先: '+u+'\nstores: '+names);
  }else{
    var errMsg=(r&&r.errorMsg)||'不明なエラー';
    box.innerHTML=cBox('e',jp(errMsg));
  }
}

async function refreshStores(){
  if(!isReady)return;
  // SBQueryのthenチェーン問題を避けるため、safeFetchを直接使う
  var h={'Content-Type':'application/json','apikey':_sbKey,'Authorization':'Bearer '+_sbKey};
  try{
    // まずis_active=trueで取得を試みる
    var r=await safeFetch(_sbUrl+'/rest/v1/stores?select=*&is_active=eq.true&order=display_order.asc&limit=100',{method:'GET',headers:h});
    if(!r.errMsg&&r.ok){
      var d=JSON.parse(r.body||'[]');
      if(Array.isArray(d)&&d.length>0){STORES=d;return;}
    }
    // 0件またはエラーならフィルタなしで再取得
    var r2=await safeFetch(_sbUrl+'/rest/v1/stores?select=*&order=display_order.asc&limit=100',{method:'GET',headers:h});
    if(!r2.errMsg&&r2.ok){
      var d2=JSON.parse(r2.body||'[]');
      if(Array.isArray(d2)&&d2.length>0)STORES=d2;
    }
  }catch(ex){
    console.warn('stores再取得失敗',safeMsg(ex));
  }
}

async function doLogin(){
  // ── バリデーション ──
  if(!S.role){toast('役割を選択してください',true);return;}
  if(S.role==='mgr'){
    // storeIdを必ず数値に統一

      S.storeErr='店舗を選択してください';
      render();

    }
    // 古いlocalStorageの店舗情報を削除（誤認の原因になるため）
    ['selectedStore','selectedStoreId','store','storeId','currentStore'].forEach(function(k){
      try{localStorage.removeItem(k);}catch(_){}
    });
    // STORESから該当店舗を探す（ID照合）
    var found=STORES.find(function(s){return Number(s.id)===Number(S.storeId);});
    if(!found){

      await refreshStores();
      found=STORES.find(function(s){return Number(s.id)===Number(S.storeId);});
    }
    if(!found){
      // それでも見つからない場合はプルダウンの選択値を名前で照合（フォールバック）
      // storeIdをリセットして選び直してもらう
      S.storeId=null;
      S.storeErr='店舗情報を再取得しました。もう一度店舗を選択してください';
      render();
      return;
    }
  }

  // ── ログインボタンを即時無効化（二重タップ防止）──
  const btn=$('login-btn');

async function fetchToday(){
  const today=jst.iso;
  if(!isReady){S.todayOrders=demoOrders();return;}
  try{
    const{data:orders,error:e1}=await SB.from('orders').select('*').eq('order_date',today).order('created_at',{ascending:false});
    if(e1)throw new Error(safeMsg(e1));
    let items=[];
    if(orders&&orders.length){
      const{data:ii,error:e2}=await SB.from('order_items').select('*').in('order_id',orders.map(o=>o.id));
      if(e2)throw new Error(safeMsg(e2));
      items=ii||[];
    }
    S.todayOrders=(orders||[]).map(o=>({...o,items:items.filter(i=>i.order_id===o.id)}));
  }catch(err){toast('データ取得エラー: '+safeMsg(err).split('\n')[0],true);S.todayOrders=demoOrders();}
}

async function fetchAdmin(){
  if(!isReady){S.adminOrders=demoOrders();return;}
  try{
    const f=S.af;
    let q=SB.from('orders').select('*').order('order_date',{ascending:false}).limit(500);
    if(f.from)q=q.gte('order_date',f.from);
    if(f.to)  q=q.lte('order_date',f.to);
    if(f.sid) q=q.eq('store_id',parseInt(f.sid));
    if(f.status)q=q.eq('status',f.status);
    const{data:orders,error:e1}=await q;
    if(e1)throw new Error(safeMsg(e1));
    let items=[];
    if(orders&&orders.length){
      const{data:ii}=await SB.from('order_items').select('*').in('order_id',orders.map(o=>o.id));
      items=ii||[];
    }
    let res=(orders||[]).map(o=>({...o,items:(items||[]).filter(i=>i.order_id===o.id)}));
    if(f.kw)res=res.filter(o=>o.store_name.includes(f.kw)||(o.memo||'').includes(f.kw)||(o.items||[]).some(i=>i.product_name.includes(f.kw)));
    S.adminOrders=res;
  }catch(err){toast('読み込みエラー: '+safeMsg(err).split('\n')[0],true);S.adminOrders=[];}
}

  let h=late?`<div class="al aw"><i class="ti ti-clock"></i><span>締切（${SD().deadline_time}）を過ぎています。締切後発注として記録されます。</span></div>`
           :`<div class="al aok"><i class="ti ti-clock"></i><span>発注締切：本日 <strong>${SD().deadline_time}</strong> まで</span></div>`;

  // 商品が0件の場合：メッセージを表示するが画面には入れる
  if(!prods.length){
    h+=`<div style="margin:16px 12px;">
      <div class="al aw">
        <i class="ti ti-package-off"></i>
        <span>この店舗に表示できる商品がまだ登録されていません。<br>
          管理者に商品設定を依頼してください。<br>
          <span style="font-size:12px;opacity:.8">（管理者 → 店舗設定 → 商品設定 で設定できます）</span>
        </span>
      </div>
    </div>`;
    h+=`<div class="fc g8 px12" style="margin-bottom:16px">
      <button class="btn bb" onclick="go('noorder_confirm')"><i class="ti ti-ban"></i>本日は発注なし</button>
      <button class="btn bgy" onclick="go('home')"><i class="ti ti-arrow-left"></i>ホームに戻る</button>
    </div>`;
    return h;
  }

  h+=`<div style="padding:8px 12px 4px"><button class="btn bgy bsm" onclick="cp()"><i class="ti ti-copy"></i>前回発注をコピー</button></div>`;
  catIds.forEach(catId=>{
    const cat=catMap[catId]||{name:'その他',id:catId};
    const ps=prods.filter(p=>p.category_id===catId);
    const key='cat_'+catId;
    if(S.catOpen[key]===undefined)S.catOpen[key]=true;
    const open=S.catOpen[key];
    const fi=ps.some(p=>(S.qty[p.id]||0)>0);
    h+=`<div style="border-bottom:1px solid var(--br)">
      <div class="cath" onclick="S.catOpen['${key}']=!S.catOpen['${key}'];render()">
        <span class="catf">${e(cat.name)}</span>
        ${fi?'<span style="font-size:12px;color:var(--g);font-weight:600">✓ 入力あり</span>':''}
        <i class="ti ti-chevron-${open?'up':'down'}" style="font-size:16px;color:var(--h)"></i>
      </div>
      ${open?ps.map(p=>{const q=S.qty[p.id]||0;return`
        <div class="pi${q>0?' f':''}">
          <div style="flex:1;min-width:0">
            <div class="pn">${p.is_frequent?'⭐ ':''}${e(p.name)}</div>
            <div class="pu">単位：${p.unit}　最小：${p.min_qty||1}${p.unit}${p.memo?'　📝'+e(p.memo):''}</div>
          </div>
          <div class="qc">
            <button class="qb" onclick="dec(${p.id},${p.min_qty||1})">−</button>
            <input class="qi" type="number" value="${q}" inputmode="decimal" step="${p.min_qty||1}"
              onchange="setQ(${p.id},this.value,${p.min_qty||1})">
            <button class="qb p" onclick="inc(${p.id},${p.min_qty||1})">＋</button>
          </div>
        </div>`}).join(''):''}
    </div>`;
  });
  h+=`<div class="fg mt12"><label class="fl" for="mi">発注メモ（任意）</label>
    <textarea class="fi" id="mi" rows="3" placeholder="CKへの連絡事項">${e(S.memo)}</textarea>
  </div>`;
  const tot=Object.values(S.qty).filter(v=>v>0).length;
  h+=`<div class="fc g8 px12" style="margin-bottom:16px">
    <button class="btn bg" onclick="goC()" style="font-size:18px;padding:18px" ${tot===0?'disabled':''}>
      <i class="ti ti-check"></i>${tot}件を確認して発注する
    </button>
    <button class="btn bgy" onclick="go('home')"><i class="ti ti-arrow-left"></i>ホームに戻る</button>
  </div>`;
  return h;
}

function vCK(){

      <div style="flex:1"><div class="bar-t">CK管理　本日の発注状況</div>

      ${lbtn()}
    </div>
    <div class="con">
      ${S.showHist?ckHV():ckTV(unc,sm)}

      <button class="nb${S.ckTab===0&&!S.showHist?' on':''}" onclick="S.ckTab=0;S.showHist=false;render()"><i class="ti ti-layout-list"></i>店舗状況</button>
      <button class="nb${S.ckTab===1&&!S.showHist?' on':''}" onclick="S.ckTab=1;S.showHist=false;render()"><i class="ti ti-chart-bar"></i>商品合計</button>
      <button class="nb${S.ckTab===2&&!S.showHist?' on':''}" onclick="S.ckTab=2;S.showHist=false;render()"><i class="ti ti-package-export"></i>出荷管理</button>
    </nav>
    ${S.detail!=null&&!S.showHist?ckDet(sm):''}
  </div>`;
}
function ckTV(unc,sm){
  return`
  <div class="tabs" style="top:64px">
    ${['店舗状況','商品合計','出荷管理'].map((t,i)=>`<div class="tab${S.ckTab===i?' on':''}" onclick="S.ckTab=${i};render()">${t}</div>`).join('')}
  </div>
  ${unc.length?`<div class="al aw"><i class="ti ti-alert-triangle"></i><span>未確認：${unc.map(s=>e(s.short_name||s.name)).join('、')}（${unc.length}店舗）</span></div>`
              :`<div class="al aok"><i class="ti ti-circle-check"></i><span>全店舗から連絡が届いています</span></div>`}
  ${S.ckTab===0?ckSt(sm):S.ckTab===1?ckTo():ckSh()}
  <div style="text-align:center;padding:6px 0 2px;font-size:11px;color:var(--h)">
    ${isReady?'30秒ごとに自動更新':'デモモード'}
    <button onclick="doRef()" style="background:none;border:none;color:var(--g);cursor:pointer;font-size:11px;margin-left:6px;text-decoration:underline">今すぐ更新</button>
  </div>
  <div style="padding:0 12px 12px">
    <button class="btn bgy" onclick="opH()" style="font-size:13px;padding:11px;color:var(--m)">
      <i class="ti ti-archive"></i>過去の出荷履歴（昨日以前）
    </button>
  </div>`;
}
function ckSt(sm){
  const n=ks=>STORES.filter(s=>ks.includes(sm[s.id])).length;
  let h=`<div class="sg">
    <div class="sc2"><div class="sl3">発注あり</div><div class="sv" style="color:var(--g)">${n(['ordered','late','ck_confirmed','shipped'])}</div></div>
    <div class="sc2"><div class="sl3">発注なし連絡</div><div class="sv" style="color:var(--b)">${n(['no_order'])}</div></div>
    <div class="sc2"><div class="sl3">未確認</div><div class="sv" style="color:var(--gr)">${n(['unconfirmed'])}</div></div>
    <div class="sc2"><div class="sl3">締切後</div><div class="sv" style="color:var(--o)">${n(['late'])}</div></div>
  </div>`;
  const grps=[
    {ks:['ordered','late','ck_confirmed','shipped'],l:'本日発注あり',c:'var(--g)'},
    {ks:['no_order'],l:'発注なし（連絡済）',c:'var(--b)'},
    {ks:['unconfirmed'],l:'未確認（まだ連絡なし）',c:'var(--gr)'},
  ];
  grps.forEach(g=>{
    const list=STORES.filter(s=>g.ks.includes(sm[s.id]));
    if(!list.length)return;
    h+=`<div class="sl2" style="color:${g.c}">${g.l}</div>
    <div class="card" style="margin-top:0">
      ${list.map(s=>{const m=sMeta(sm[s.id]);const o=S.todayOrders.find(o=>o.store_id===s.id);
        const t=o?new Date(o.created_at).toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'}):null;
        return`<div class="sr" onclick="S.detail=${s.id};render()">
          <div class="sd" style="background:${m.d}"></div>
          <div style="flex:1;min-width:0">
            <div style="font-size:15px;font-weight:600">${e(s.name)}</div>
            <div style="font-size:12px;color:var(--m)">${t?t+' 送信':'—'}${o&&o.items&&o.items.length?' · '+o.items.length+'品目':''}</div>
          </div>${bdg(sm[s.id])}
          <i class="ti ti-chevron-right" style="font-size:16px;color:var(--h);flex-shrink:0"></i>
        </div>`;}).join('')}
    </div>`;
  });
  return h;
}
function ckTo(){
  const tot={};
  S.todayOrders.filter(o=>o.status!=='no_order').forEach(o=>{
    (o.items||[]).forEach(i=>{
      const k=`${i.product_name}||${i.unit}`;
      const pr=PRODUCTS.find(p=>p.name===i.product_name);
      tot[k]=tot[k]||{name:i.product_name,unit:i.unit,qty:0,catId:pr?pr.category_id:0};
      tot[k].qty+=Number(i.quantity);
    });
  });
  const n=S.todayOrders.filter(o=>o.status!=='no_order').length;
  let h=`<div style="padding:10px 12px 4px;font-size:13px;color:var(--m)">発注店舗の合計（本日 ${n}店舗）</div>`;
  if(!Object.keys(tot).length)return h+`<div class="emp">本日の発注データがありません</div>`;
  CATS.forEach(cat=>{
    const items=Object.values(tot).filter(t=>t.catId===cat.id);
    if(!items.length)return;
    h+=`<div class="sl2" style="display:flex;align-items:center;gap:6px">${e(cat.name)}</div>
    <div class="card" style="margin-top:0">
      ${items.map(i=>`<div class="ro"><span class="rn">${e(i.name)}</span><span class="rq">${i.qty} ${e(i.unit)}</span></div>`).join('')}
    </div>`;
  });
  // カテゴリー未設定分
  const other=Object.values(tot).filter(t=>!CATS.find(c=>c.id===t.catId));
  if(other.length){h+=`<div class="sl2">その他</div><div class="card" style="margin-top:0">${other.map(i=>`<div class="ro"><span class="rn">${e(i.name)}</span><span class="rq">${i.qty} ${e(i.unit)}</span></div>`).join('')}</div>`;}
  return h;
}
function ckSh(){
  const list=S.todayOrders.filter(o=>o.status!=='no_order');
  if(!list.length)return`<div class="emp">本日発注のある店舗はありません</div>`;
  return list.map(o=>{
    const st=STORES.find(s=>s.id===o.store_id);
    const rdy=S.ckChecked[o.id+'_r']||false,shp=S.ckChecked[o.id+'_s']||false;
    return`<div class="card">
      <div class="ch" style="background:var(--sf)">
        <i class="ti ti-building-store" style="color:var(--g);font-size:20px"></i>
        <div class="ct">${e(st?st.name:o.store_name)}</div>
        ${o.is_late?'<span class="bdg blate" style="margin-right:4px">締切後</span>':''}
        <span class="bdg ${shp?'bship':rdy?'bck':'bunc'}">${shp?'出荷済':rdy?'準備済':'未チェック'}</span>
      </div>
      ${(o.items||[]).map((it,i)=>{const k=o.id+'_i'+i;const on=S.ckChecked[k]||false;return`
      <div class="ckr" onclick="S.ckChecked['${k}']=!on;render()">
        <div class="cb${on?' on':''}"> ${on?'<i class="ti ti-check" style="font-size:16px"></i>':''}</div>
        <span style="flex:1;font-size:14px">${e(it.product_name)}</span>
        <span class="rq" style="flex-shrink:0">${it.quantity} ${e(it.unit)}</span>
      </div>`;}).join('')}
      ${o.memo?`<div style="padding:10px 16px;font-size:13px;color:var(--m);border-top:1px solid var(--br)">📝 ${e(o.memo)}</div>`:''}
      <div style="display:flex;gap:8px;padding:12px">
        <button class="btn bsm${rdy?' bg':' bo'}" style="flex:1" onclick="ckR('${o.id}')">${rdy?'✓ 準備済み':'出荷準備済にする'}</button>
        <button class="btn bsm${shp?' bg':' bgy'}" style="flex:1" onclick="ckS('${o.id}')">${shp?'✓ 出荷済み':'出荷済みにする'}</button>
      </div>
    </div>`;
  }).join('');
}
function ckDet(sm){
  const sid=S.detail,st=STORES.find(x=>x.id===sid),status=sm[sid]||'unconfirmed';
  const m=sMeta(status),o=S.todayOrders.find(x=>x.store_id===sid);
  const t=o?new Date(o.created_at).toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'}):null;
  return`<div class="modal-bg" onclick="S.detail=null;render()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="mh">
        <div><div class="mt">${e(st?st.name:'')}</div><div style="font-size:12px;color:var(--m);margin-top:2px">${st?e(st.manager_name||''):''}${t?' ｜ '+t+' 送信':''}</div></div>
        ${bdg(status)}
        <button class="xcl" onclick="S.detail=null;render()"><i class="ti ti-x"></i></button>
      </div>
      ${status==='unconfirmed'?`<div class="al aw"><i class="ti ti-alert-triangle"></i><span>発注も「発注なし」連絡も届いていません。</span></div>`:''}
      ${status==='no_order'?`<div class="al ai"><i class="ti ti-info-circle"></i><span>「本日は発注なし」の連絡がありました。</span></div>`:''}
      ${o&&o.items&&o.items.length?`<div class="sl2">発注内容</div><div class="card" style="margin-top:0">
        ${o.items.map(i=>`<div class="ro"><span class="rn">${e(i.product_name)}</span><span class="rq">${i.quantity} ${e(i.unit)}</span></div>`).join('')}
      </div>`:''}
      ${o&&status!=='no_order'?`<div class="fc g8 px12 mt8">
        <button class="btn bo" onclick="ckR('${o.id}');S.detail=null;render()"><i class="ti ti-package"></i>出荷準備済みにする</button>
        <button class="btn bgy" onclick="ckS('${o.id}');S.detail=null;render()"><i class="ti ti-truck"></i>出荷済みにする</button>
      </div>`:''}
      <div class="px12 mt8" style="margin-bottom:8px">
        <button class="btn bgy" onclick="S.detail=null;render()"><i class="ti ti-arrow-left"></i>閉じる</button>
      </div>
    </div>
  </div>`;
}
function ckHV(){
  const bd={};S.histOrders.forEach(o=>{if(!bd[o.order_date])bd[o.order_date]=[];bd[o.order_date].push(o);});
  const dates=Object.keys(bd).sort().reverse();
  return`
  <div style="padding:12px 12px 6px;display:flex;align-items:center;gap:10px">
    <button onclick="S.showHist=false;render()" style="background:none;border:none;color:var(--g);cursor:pointer;font-size:14px;display:flex;align-items:center;gap:4px;padding:0">
      <i class="ti ti-arrow-left" style="font-size:18px"></i>本日に戻る
    </button>
    <div style="font-size:15px;font-weight:600;flex:1">過去の出荷履歴</div>
  </div>

  ${dates.length?dates.map(date=>`
    <div class="sl2" style="color:var(--t)">${date}</div>
    <div class="card" style="margin-top:0">
      ${bd[date].map(o=>{const st=STORES.find(s=>s.id===o.store_id);const t=new Date(o.created_at).toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'});
        return`<div style="padding:12px 16px;border-bottom:1px solid var(--br)">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
            <div style="font-size:14px;font-weight:600;flex:1">${e(st?st.name:o.store_name)}</div>${bdg(o.status)}</div>
          <div style="font-size:12px;color:var(--m)">${t} ｜ ${o.items&&o.items.length?o.items.length+'品目':'発注なし'}</div>
        </div>`;}).join('')}
    </div>`).join('')
  :`<div class="emp">過去の履歴がありません</div>`}`;
}

   MODAL （商品追加・編集）

function renderModal(){
  const m=S.modal;
  if(!m)return;
  let html='';
  if(m.type==='product')html=modalProduct(m.data);
  else if(m.type==='category')html=modalCategory(m.data);
  else if(m.type==='store_products')html=modalStoreProducts(m.data);
  const el=document.createElement('div');
  el.id='modal-container';
  el.innerHTML=html;
  document.body.appendChild(el);
}

function closeModal(){
  S.modal=null;
  const el=$('modal-container');
  if(el)el.remove();
}

/* ── 商品モーダル ── */
function openProductModal(productId){
  // IDの型統一（Supabaseから取得したIDがstring/numberどちらでも対応）
  const pid = productId ? Number(productId) : null;
  const p = pid ? PRODUCTS.find(x => Number(x.id) === pid) : null;

  let visStores;
  if (!pid) {
    // 新規：全店舗チェック
    visStores = STORES.map(s => s.id);
  } else {
    // 既存：PSVから取得（keyがstring/numberどちらでも対応）
    const psvEntry = PSV[pid] || PSV[String(pid)];
    if (!psvEntry || psvEntry.length === 0) {
      visStores = STORES.map(s => s.id);
    } else {
      visStores = [...psvEntry];
    }
  }

  S.modal = { type:'product', data:{ p, visStores } };
  const old = $('modal-container');
  if (old) old.remove();
  renderModal();
}

function toggleVisStore(storeId){

  const vs=S.modal.data.visStores;

  if(idx>=0)vs.splice(idx,1);else vs.push(storeId);

function selAllStores(sel){
  if(!S.modal||S.modal.type!=='product')return;
  S.modal.data.visStores=sel?[...STORES.map(s=>s.id)]:[];
  // チェックボックスを直接更新
  STORES.forEach(s=>{const el=$(`pm-vis-${s.id}`);if(el)el.checked=sel;});
  // ラベルの色も更新
  const labels=document.querySelectorAll('[id^="pm-vis-"]');
  labels.forEach(el=>{
    const sid=parseInt(el.id.replace('pm-vis-',''));
    const lbl=el.closest('label');
    if(lbl){lbl.style.background=sel?'var(--gl)':'#fff';lbl.style.borderColor=sel?'var(--g)':'var(--br)';}

async function saveProduct(productId){
  const name=($('pm-name').value||'').trim();
  const catId=parseInt($('pm-cat').value)||0;
  const unit=($('pm-unit').value||'').trim();
  const minQty=parseFloat($('pm-min').value)||1;
  const dispOrd=parseInt($('pm-ord').value)||10;
  const memo=($('pm-memo').value||'').trim();
  const freq=$('pm-freq').checked;
  const errEl=$('pm-err');

  if(!name){errEl.innerHTML=`<div class="al ae"><i class="ti ti-alert-circle"></i><span>商品名を入力してください</span></div>`;return;}
  if(!catId){errEl.innerHTML=`<div class="al ae"><i class="ti ti-alert-circle"></i><span>カテゴリーを選択してください</span></div>`;return;}
  if(!unit){errEl.innerHTML=`<div class="al ae"><i class="ti ti-alert-circle"></i><span>単位を入力してください</span></div>`;return;}

  // チェックボックスから最新の表示店舗を取得
  const visStores=STORES.filter(s=>{const el=$(`pm-vis-${s.id}`);return el&&el.checked;}).map(s=>s.id);
  const cat=CATS.find(c=>c.id===catId);
  const payload={name,category_id:catId,category_name:cat?cat.name:'',unit,min_qty:minQty,display_order:dispOrd,memo,is_frequent:freq,is_active:true};

  const btn=$('pm-save');if(btn)btn.disabled=true;
  errEl.innerHTML=`<div class="cbox cif"><div class="sp spsm"></div><span>保存中…</span></div>`;

  try{
    let savedId=productId;
    if(!isReady){
      // デモモード：ローカルデータを更新
      if(productId){
        const idx=PRODUCTS.findIndex(p=>p.id===productId);
        if(idx>=0)PRODUCTS[idx]={...PRODUCTS[idx],...payload};
      }else{
        const newId=Date.now();
        PRODUCTS.push({id:newId,...payload});
        savedId=newId;
      }
      // PSVもローカル更新
      if(savedId){
        if(visStores.length)PSV[savedId]=visStores;
        else delete PSV[savedId];
      }
    }else{
      // Supabase保存
      if(productId){
        // 更新：updated_atも含める
        const updatePayload={...payload,updated_at:new Date().toISOString()};
        const{error}=await SB.from('products').update(updatePayload).eq('id',productId);
        if(error)throw new Error(safeMsg(error));
        savedId=productId;
      }else{
        // 新規挿入
        const{data,error}=await SB.from('products').insert(payload).select();
        if(error)throw new Error(safeMsg(error));
        if(data&&data.length)savedId=data[0].id;
        else throw new Error('商品の追加に失敗しました（IDが取得できませんでした）');
      }
      // PSV保存：既存を全削除→再挿入
      if(savedId){
        await SB.from('product_store_visibility').delete().eq('product_id',savedId);
        if(visStores.length){
          const psvRows=visStores.map(sid=>({product_id:savedId,store_id:sid,is_visible:true}));
          const{error:pe}=await SB.from('product_store_visibility').insert(psvRows);
          if(pe)console.warn('PSV保存失敗',safeMsg(pe));
        }
      }
      // マスターデータ再読み込み
      await reloadMaster();
    }

    // モーダルを閉じて商品管理タブに戻る
    S.modal=null;
    S.adminTab=1; // 商品管理タブ
    const mc=$('modal-container');if(mc)mc.remove();
    toast(productId?'商品を更新しました':'商品を追加しました');
    render();
  }catch(err){
    if(btn)btn.disabled=false;
    errEl.innerHTML=`<div class="al ae"><i class="ti ti-alert-circle"></i><span>${e(safeMsg(err))}</span></div>`;
  }
}

async function toggleProductActive(productId,active){
  if(!confirm(active?'この商品を表示に戻しますか？':'この商品を非表示にしますか？'))return;
  try{
    const idx=PRODUCTS.findIndex(p=>p.id===productId);
    if(idx>=0)PRODUCTS[idx].is_active=active;
    if(isReady){
      const{error}=await SB.from('products').update({is_active:active,updated_at:new Date().toISOString()}).eq('id',productId);
      if(error)throw new Error(safeMsg(error));
      await reloadMaster();
    }
    S.adminTab=1;
    toast(active?'商品を表示に戻しました':'商品を非表示にしました');
    render();
  }catch(err){toast('更新失敗: '+safeMsg(err),true);}
}

async function deleteProduct(productId){
  if(!confirm('この商品を削除しますか？\n削除後は元に戻せません。\n「非表示」にする場合はキャンセルして非表示ボタンをご利用ください。'))return;
  try{
    PRODUCTS=PRODUCTS.filter(p=>p.id!==productId);
    delete PSV[productId];
    if(isReady){
      await SB.from('product_store_visibility').delete().eq('product_id',productId);
      const{error}=await SB.from('products').delete().eq('id',productId);
      if(error)throw new Error(safeMsg(error));
    }
    S.modal=null;
    S.adminTab=1;
    const mc=$('modal-container');if(mc)mc.remove();
    toast('商品を削除しました');
    render();
  }catch(err){toast('削除失敗: '+safeMsg(err),true);}
}

  return`<div class="modal-bg">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="mh">
        <div class="mt">${isNew?'カテゴリーを追加':'カテゴリーを編集'}</div>
        <button class="xcl" onclick="closeModal()"><i class="ti ti-x"></i></button>
      </div>
      <div style="padding:16px;display:flex;flex-direction:column;gap:12px">
        <div>
          <label class="fl">カテゴリー名 <span style="color:var(--rd)">*</span></label>
          <input type="text" class="fi" id="cm-name" value="${e(c?c.name:'')}" placeholder="例：肉類">
        </div>
        <div>
          <label class="fl">表示順（数字が小さいほど上）</label>
          <input type="number" class="fi" id="cm-ord" value="${c?c.display_order:10}" min="0" step="10">
        </div>
        <div id="cm-err" style="min-height:4px"></div>
        <button class="btn bg" id="cm-save" onclick="saveCat(${c?c.id:'null'})">
          <i class="ti ti-device-floppy"></i>${isNew?'追加する':'保存する'}
        </button>
        ${!isNew?`<button class="btn brd" onclick="deleteCat(${c.id})"><i class="ti ti-trash"></i>削除する</button>`:''}
        <button class="btn bgy" onclick="closeModal()"><i class="ti ti-arrow-left"></i>キャンセル</button>
      </div>
    </div>
  </div>`;
}

async function saveCat(catId){
  const name=($('cm-name').value||'').trim();
  const ord=parseInt($('cm-ord').value)||10;
  const errEl=$('cm-err');
  if(!name){errEl.innerHTML=`<div class="al ae"><i class="ti ti-alert-circle"></i><span>カテゴリー名を入力してください</span></div>`;return;}
  const btn=$('cm-save');if(btn)btn.disabled=true;
  errEl.innerHTML=`<div class="cbox cif"><div class="sp spsm"></div><span>保存中…</span></div>`;
  try{
    if(!isReady){
      if(catId){const idx=CATS.findIndex(c=>c.id===catId);if(idx>=0)CATS[idx]={...CATS[idx],name,display_order:ord};}
      else CATS.push({id:Date.now(),name,display_order:ord,is_active:true});
    }else{
      if(catId){
        const{error}=await SB.from('categories').update({name,display_order:ord,updated_at:new Date().toISOString()}).eq('id',catId);
        if(error)throw new Error(safeMsg(error));
      }else{
        const{error}=await SB.from('categories').insert({name,display_order:ord,is_active:true});
        if(error)throw new Error(safeMsg(error));
      }
      await reloadMaster();
    }
    S.modal=null;S.adminTab=2;
    const mc=$('modal-container');if(mc)mc.remove();
    toast(catId?'カテゴリーを更新しました':'カテゴリーを追加しました');
    render();
  }catch(err){
    if(btn)btn.disabled=false;
    errEl.innerHTML=`<div class="al ae"><i class="ti ti-alert-circle"></i><span>${e(safeMsg(err))}</span></div>`;
  }
}

async function deleteCat(catId){
  if(!confirm('このカテゴリーを削除しますか？\nこのカテゴリーの商品は「その他」になります。'))return;
  try{
    CATS=CATS.filter(c=>c.id!==catId);
    if(isReady){
      const{error}=await SB.from('categories').delete().eq('id',catId);
      if(error)throw new Error(safeMsg(error));
      await reloadMaster();
    }
    S.modal=null;S.adminTab=2;
    const mc=$('modal-container');if(mc)mc.remove();
    toast('カテゴリーを削除しました');render();
  }catch(err){toast('削除失敗: '+safeMsg(err),true);}
}

/* ── 店舗別商品設定モーダル ── */

  S.modal = { type:'store_products', data:{ storeId } };
  const old=$('modal-container'); if(old)old.remove();
  renderModal();
}

function modalStoreProducts(d){
  const store=STORES.find(s=>s.id===d.storeId);
  const prods=PRODUCTS.filter(p=>p.is_active!==false);
  const visIds=prods.filter(p=>{const v=PSV[p.id];return!v||v.length===0||v.includes(d.storeId);}).map(p=>p.id);
  const catMap={};CATS.forEach(c=>{catMap[c.id]=c;});
  const catIds=[...new Set(prods.map(p=>p.category_id))];
  return`<div class="modal-bg">
    <div class="modal" onclick="event.stopPropagation()" style="max-height:95vh">
      <div class="mh">
        <div><div class="mt">${e(store?store.name:'')} の商品設定</div>
          <div style="font-size:12px;color:var(--m);margin-top:2px">チェックした商品がこの店舗の発注画面に表示されます</div></div>
        <button class="xcl" onclick="closeModal()"><i class="ti ti-x"></i></button>
      </div>
      <div style="padding:8px 12px;display:flex;gap:8px">
        <button class="btn bg bsm" onclick="saveStoreProds(${d.storeId})"><i class="ti ti-device-floppy"></i>保存する</button>
        <button class="btn bgy bsm" onclick="closeModal()">キャンセル</button>
      </div>
      ${catIds.map(catId=>{
        const cat=catMap[catId]||{name:'その他'};
        const ps=prods.filter(p=>p.category_id===catId);
        return`<div class="sl2">${e(cat.name)}</div>
        <div class="card" style="margin-top:0">
          ${ps.map(p=>{const vis=visIds.includes(p.id);return`
          <div class="pi">
            <label style="display:flex;align-items:center;gap:10px;flex:1;cursor:pointer">
              <input type="checkbox" id="sv-${p.id}" ${vis?'checked':''} style="width:20px;height:20px;flex-shrink:0">
              <div><div class="pn">${e(p.name)}</div><div class="pu">${e(p.unit)}</div></div>
            </label>
          </div>`;}).join('')}
        </div>`;}).join('')}
      <div id="spm-err" style="padding:0 12px;min-height:4px"></div>
      <div style="padding:12px;display:flex;gap:8px">
        <button class="btn bg bsm" onclick="saveStoreProds(${d.storeId})" style="flex:1"><i class="ti ti-device-floppy"></i>保存する</button>
        <button class="btn bgy bsm" onclick="closeModal()" style="flex:1">キャンセル</button>
      </div>
    </div>
  </div>`;
}

async function saveStoreProds(storeId){
  const errEl=$('spm-err');
  // 選択された商品IDを収集
  const selected=PRODUCTS.filter(p=>p.is_active!==false&&$(`sv-${p.id}`)&&$(`sv-${p.id}`).checked).map(p=>p.id);
  try{
    if(!isReady){
      // デモ: PSVを更新
      PRODUCTS.filter(p=>p.is_active!==false).forEach(p=>{
        const cur=PSV[p.id]||[...STORES.map(s=>s.id)];
        if(selected.includes(p.id)){if(!cur.includes(storeId))cur.push(storeId);}
        else{const idx=cur.indexOf(storeId);if(idx>=0)cur.splice(idx,1);}
        PSV[p.id]=cur;
      });
    }else{
      // Supabase: この店舗の全PSVを削除して再挿入
      await SB.from('product_store_visibility').delete().eq('store_id',storeId);
      if(selected.length){
        const rows=selected.map(pid=>({product_id:pid,store_id:storeId,is_visible:true}));
        const{error}=await SB.from('product_store_visibility').insert(rows);
        if(error)throw new Error(safeMsg(error));
      }
      await reloadMaster();
    }
    S.modal=null;S.adminTab=3;
    const mc=$('modal-container');if(mc)mc.remove();
    toast(`${STORES.find(s=>s.id===storeId)?.name||''}の商品設定を保存しました`);
    render();
  }catch(err){
    if(errEl)errEl.innerHTML=`<div class="al ae"><i class="ti ti-alert-circle"></i><span>${e(safeMsg(err))}</span></div>`;
  }
}

/* ══════════════════════════════════════════
   ACTIONS
══════════════════════════════════════════ */
function doOut(){
  if(autoTimer){clearInterval(autoTimer);autoTimer=null;}
  if(dateTimer){clearInterval(dateTimer);dateTimer=null;}
  S={view:'login',role:null,storeId:null,storeErr:'',phase:'home',qty:{},memo:'',catOpen:{},ckTab:0,
    detail:null,ckChecked:{},showHist:false,histOrders:[],todayOrders:[],
    adminTab:0,adminOrders:[],af:{from:'',to:'',sid:'',catId:'',status:'',kw:''},
    submitting:false,modal:null,bootError:''};
  render();
}
function go(ph){S.phase=ph;render();}
function inc(id,min){S.qty[id]=Math.round(((S.qty[id]||0)+min)*1000)/1000;render();}
function dec(id,min){S.qty[id]=Math.max(0,Math.round(((S.qty[id]||0)-min)*1000)/1000);render();}
function setQ(id,v,min){const n=parseFloat(v)||0;S.qty[id]=Math.max(0,Math.round(n/min)*min);render();}
function cp(){S.qty={};const prods=productsForStore(S.storeId);prods.slice(0,8).forEach(p=>{S.qty[p.id]=p.min_qty||1;});toast('前回発注をコピーしました（デフォルト値）');render();}
function cpA(){cp();S.phase='order';render();}
function goC(){const m=$('mi');if(m)S.memo=m.value.trim();S.phase='confirm';render();}

async function doSub(){
  if(S.submitting)return;
  S.submitting=true;const btn=$('sub');if(btn)btn.disabled=true;
  showL('発注をCKに送信中…');
  const items=PRODUCTS.filter(p=>(S.qty[p.id]||0)>0).map(p=>({product_id:p.id,product_name:p.name,quantity:S.qty[p.id],unit:p.unit}));
  const late=isLate(),st=SD();
  const pl={store_id:S.storeId,store_name:st.name,order_date:jst.iso,status:late?'late':'ordered',memo:S.memo||'',is_late:late,created_by:st.manager_name||'店長'};
  try{
    if(isReady){
      const{data:ord,error:e1}=await SB.from('orders').insert(pl).select();
      if(e1)throw new Error(safeMsg(e1));
      const oid=ord[0].id;
      if(items.length){const{error:e2}=await SB.from('order_items').insert(items.map(i=>({...i,order_id:oid})));if(e2)throw new Error(safeMsg(e2));}
      S.todayOrders=S.todayOrders.filter(o=>o.store_id!==S.storeId);
      S.todayOrders.push({...ord[0],items:items.map(i=>({product_name:i.product_name,quantity:i.quantity,unit:i.unit}))});
    }else{
      const d={id:'d'+Date.now(),...pl,created_at:new Date().toISOString(),items:items.map(i=>({product_name:i.product_name,quantity:i.quantity,unit:i.unit}))};
      S.todayOrders=S.todayOrders.filter(o=>o.store_id!==S.storeId);S.todayOrders.push(d);
    }
    hideL();S.submitting=false;S.phase='success';render();
  }catch(err){
    hideL();S.submitting=false;if(btn)btn.disabled=false;render();
    toast('発注の送信に失敗しました。\n通信環境を確認してもう一度送信してください。\n（'+safeMsg(err)+'）',true);
  }
}

async function doNo(){
  if(S.submitting)return;S.submitting=true;showL('CKに連絡中…');
  const st=SD();
  const pl={store_id:S.storeId,store_name:st.name,order_date:jst.iso,status:'no_order',memo:'',is_late:false,created_by:st.manager_name||'店長'};
  try{
    if(isReady){
      const{data:ord,error}=await SB.from('orders').insert(pl).select();
      if(error)throw new Error(safeMsg(error));
      S.todayOrders=S.todayOrders.filter(o=>o.store_id!==S.storeId);S.todayOrders.push({...ord[0],items:[]});
    }else{
      const d={id:'d'+Date.now(),...pl,created_at:new Date().toISOString(),items:[]};
      S.todayOrders=S.todayOrders.filter(o=>o.store_id!==S.storeId);S.todayOrders.push(d);
    }
    hideL();S.submitting=false;S.phase='noorder_done';render();
  }catch(err){hideL();S.submitting=false;render();toast('送信失敗: '+safeMsg(err),true);}
}

async function ckR(id){
  S.ckChecked[id+'_r']=true;
  if(isReady){const{error}=await SB.from('orders').update({status:'ck_confirmed',ck_ready_at:new Date().toISOString()}).eq('id',id);if(!error){const o=S.todayOrders.find(x=>x.id===id);if(o)o.status='ck_confirmed';}}
  else{const o=S.todayOrders.find(x=>x.id===id);if(o)o.status='ck_confirmed';}
  render();
}
async function ckS(id){
  S.ckChecked[id+'_r']=true;S.ckChecked[id+'_s']=true;
  if(isReady){const{error}=await SB.from('orders').update({status:'shipped',shipped_at:new Date().toISOString()}).eq('id',id);if(!error){const o=S.todayOrders.find(x=>x.id===id);if(o)o.status='shipped';}}
  else{const o=S.todayOrders.find(x=>x.id===id);if(o)o.status='shipped';}
  render();
}

async function opH(){showL('過去の履歴を読み込み中…');await fetchHist();hideL();S.showHist=true;render();}
async function doRef(){showL('最新データを取得中…');await fetchToday();hideL();render();toast('更新しました');}
async function adRef(){showL('データを読み込み中…');await fetchAdmin();hideL();render();toast('更新しました');}
function clrF(){const t=jst.iso,mo=new Date();mo.setDate(mo.getDate()-30);S.af={from:mo.toISOString().slice(0,10),to:t,sid:'',catId:'',status:'',kw:''};render();}

function doCSV(){
  const rows=[['発注日','店舗名','商品名','数量','単位','ステータス','締切後','メモ','発注時間','CK確認','出荷']];
  S.adminOrders.forEach(o=>{
    const t=new Date(o.created_at).toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'});
    const sl=sMeta(o.status).l,ck=o.status==='ck_confirmed'||o.status==='shipped'?'済':'未',sh=o.status==='shipped'?'済':'未';
    if(!o.items||!o.items.length)rows.push([o.order_date,o.store_name,'（発注なし）','','',sl,o.is_late?'はい':'いいえ',o.memo||'',t,ck,sh]);
    else o.items.forEach(i=>rows.push([o.order_date,o.store_name,i.product_name,i.quantity,i.unit,sl,o.is_late?'はい':'いいえ',o.memo||'',t,ck,sh]));
  });
  const csv='\uFEFF'+rows.map(r=>r.map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download=`発注履歴_${jst.iso}.csv`;a.click();
  URL.revokeObjectURL(url);toast('CSVをダウンロードしました（'+rows.length+'行）');
}

/* ══════════════════════════════════════════
   起動処理
══════════════════════════════════════════ */
(async function boot(){
  const saved=lCfg();
  const codeUrl=cleanUrl(SUPABASE_URL||'');
  const codeKey=((SUPABASE_ANON_KEY||'').trim().replace(/\s/g,''));
  const url=codeUrl||cleanUrl(saved.url||'');
  const key=codeKey||(saved.anonKey||'').trim();
  if(url&&key){
    showL('Supabaseに自動接続中…');
    const r=await initSB(url,key);
    hideL();
    if(r.ok){
      sCfg(url,key);
      // 接続成功 → storesを確実に取得してからログイン画面へ
      await ensureStores();
      S.view='login';
    }else{
      S.view='setup';S.bootError=jp(r.errorMsg||'不明なエラー');
    }
  }else{
    S.view='setup';
  }
  startDW();
  render();
})();
