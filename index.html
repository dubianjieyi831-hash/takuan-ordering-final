<script>
'use strict';

  {id:10,name:'乾物',display_order:100},{id:11,name:'容器',display_order:110},{id:12,name:'箸・袋',display_order:120},
  {id:13,name:'備品',display_order:130},{id:14,name:'消耗品',display_order:140},{id:15,name:'その他',display_order:150}
];

/* ─── グローバル変数 ─── */
var _sbUrl='',_sbKey='',isReady=false;
var STORES=DEF_STORES.slice(),CATS=DEF_CATS.slice(),PRODUCTS=[],PSV={};

/* ─── ユーティリティ ─── */
function getJST(){
  var p=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  var iso=p.find(function(x){return x.type==='year';}).value+'-'+p.find(function(x){return x.type==='month';}).value+'-'+p.find(function(x){return x.type==='day';}).value;
  var pts=iso.split('-').map(Number);
  var w=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',weekday:'short'}).format(new Date(pts[0],pts[1]-1,pts[2]));
  return{iso:iso,disp:pts[0]+'年'+pts[1]+'月'+pts[2]+'日（'+w+'）'};
}
var jst=getJST();
function cleanUrl(r){return(r||'').trim().replace(/\r?\n|\s/g,'').replace(/\/rest\/v1.*$/,'').replace(/\/+$/,'').replace(/^http:\/\//,'https://').replace(/^(?!https?:\/\/)/,'https://');}
function safeStr(e){
  if(!e)return'不明なエラー';
  if(typeof e==='string')return e;
  if(e instanceof Error)return e.message||String(e);
  try{var m=e.message||e.hint||e.details||e.error||'';return m?String(m):JSON.stringify(e);}catch(_){return String(e);}
}
function jpErr(s){
  var msg=typeof s==='string'?s:safeStr(s);
  if(!msg)return'原因不明のエラーです。';
  if(msg.includes('Failed to fetch')||msg.includes('NetworkError'))return'通信エラー\nVercel公開URLで開いてください。localhost・ファイル直接開き・Claudeプレビューでは接続できません。';
  if(msg.includes('401')||msg.includes('invalid_jwt'))return'Anon Keyが正しくありません（401）\nSettings > API の「anon public」を確認してください。';
  if(msg.includes('403')||msg.includes('permission denied'))return'RLSポリシーエラー（403）\nSQL Editorで supabase_final.sql を再実行してください。';
  if(msg.includes('does not exist')||msg.includes('relation'))return'テーブルが存在しません。\nSQL Editorで supabase_final.sql を実行してください。';
  return'エラー: '+msg;
}
var $=function(id){return document.getElementById(id);};

function SD(){return STORES.find(function(s){return s.id===S.storeId;});}
function isLate(){var st=SD();if(!st)return false;var hm=(st.deadline_time||'10:00').split(':').map(Number),n=new Date();return n.getHours()*60+n.getMinutes()>=hm[0]*60+hm[1];}

  var t=$('toast');if(!t)return;
  t.textContent=msg;t.style.background=err?'#E24B4A':'#2C2C2A';
  t.classList.add('on');setTimeout(function(){t.classList.remove('on');},err?4500:2500);
}

}

/* ─── Supabase REST クライアント（純粋fetchベース）─── */
async function _fetch(url,opts){
  var res={ok:false,status:0,body:'',err:''};
  try{
    var resp;
    try{resp=await fetch(url,opts);}
    catch(ne){res.err=String(ne&&ne.message?ne.message:'Failed to fetch');return res;}
    res.status=resp.status;res.ok=resp.ok;
    try{res.body=await resp.text();}catch(_){}
    return res;
  }catch(ue){res.err=String(ue&&ue.message?ue.message:'予期しないエラー');return res;}
}
function _hdrs(){return{'Content-Type':'application/json','apikey':_sbKey,'Authorization':'Bearer '+_sbKey,'Prefer':'return=representation'};}
function sbFrom(table){
  var _f=[],_ord=null,_lim=null,_m='GET',_bdy=null,_sel='*';
  var q={
    select:function(c){_sel=c||'*';return q;},
    eq:function(c,v){_f.push(c+'=eq.'+encodeURIComponent(String(v)));return q;},
    lt:function(c,v){_f.push(c+'=lt.'+v);return q;},
    lte:function(c,v){_f.push(c+'=lte.'+v);return q;},
    gte:function(c,v){_f.push(c+'=gte.'+v);return q;},
    in:function(c,vs){_f.push(c+'=in.('+vs.map(String).join(',')+')');return q;},
    order:function(c,opt){_ord=c+'.'+(opt&&opt.ascending===false?'desc':'asc');return q;},
    limit:function(n){_lim=n;return q;},
    insert:function(d){_m='POST';_bdy=d;return q;},
    update:function(d){_m='PATCH';_bdy=d;return q;},
    delete:function(){_m='DELETE';_bdy=null;return q;},
    then:function(resolve,reject){
      (async function(){
        var parts=_f.slice();
        if(_sel)parts.push('select='+_sel);
        if(_ord)parts.push('order='+_ord);
        if(_lim)parts.push('limit='+_lim);
        var qs=parts.length?'?'+parts.join('&'):'';
        var r=await _fetch(_sbUrl+'/rest/v1/'+table+qs,{method:_m,headers:_hdrs(),body:_bdy!=null?JSON.stringify(_bdy):undefined});
        if(r.err){resolve({data:null,error:{message:r.err}});return;}
        if(!r.ok){
          var em='HTTP '+r.status;
          try{var j=JSON.parse(r.body);em=j.message||j.hint||j.error||em;}catch(_){}
          resolve({data:null,error:{message:String(em)}});return;
        }
        var data=[];
        try{var p=r.body?JSON.parse(r.body):null;data=Array.isArray(p)?p:(p!=null?[p]:[]);}catch(_){}
        resolve({data:data,error:null});
      })().catch(function(e){resolve({data:null,error:{message:safeStr(e)}});});
    }
  };
  return q;
}

/* ─── Supabase 初期化 ─── */
async function initSB(url,key){
  var u=cleanUrl(url),k=(key||'').trim().replace(/\s/g,'');
  if(!u||!k)return{ok:false,errorMsg:'URLとAnon Keyを入力してください'};
  var r=await _fetch(u+'/rest/v1/stores?select=id%2Cname&limit=1',{method:'GET',headers:{'Content-Type':'application/json','apikey':k,'Authorization':'Bearer '+k}});
  if(r.err)return{ok:false,errorMsg:r.err};
  if(r.status===401)return{ok:false,errorMsg:'HTTP 401: Anon Keyが正しくありません。'};
  if(r.status===403){var h='';try{h=JSON.parse(r.body).hint||'';}catch(_){}return{ok:false,errorMsg:'HTTP 403: RLSポリシーエラー'+(h?'\n'+h:'')};}
  if(r.status===404)return{ok:false,errorMsg:'HTTP 404: storesテーブルが見つかりません。'};
  if(r.status>=400){var mx='HTTP '+r.status;try{var jx=JSON.parse(r.body);mx+=': '+(jx.message||jx.error||'');}catch(_){}return{ok:false,errorMsg:mx};}
  if(r.status!==200)return{ok:false,errorMsg:'HTTP '+r.status};
  _sbUrl=u;_sbKey=k;isReady=true;
  var names='';try{var rws=JSON.parse(r.body);if(Array.isArray(rws))names=rws.map(function(s){return s.name||'';}).join('、');}catch(_){}
  await loadMaster();
  return{ok:true,storeNames:names};
}

async function loadMaster(){
  if(!isReady)return;
  try{var sr=await sbFrom('stores').select('*').order('display_order');if(!sr.error&&sr.data&&sr.data.length)STORES=sr.data;else{var sr2=await sbFrom('stores').select('*');if(!sr2.error&&sr2.data&&sr2.data.length)STORES=sr2.data;}}catch(_){}
  try{var cr=await sbFrom('categories').select('*').order('display_order');if(!cr.error&&cr.data&&cr.data.length)CATS=cr.data;}catch(_){}
  try{var pr=await sbFrom('products').select('*').order('display_order');if(!pr.error&&pr.data)PRODUCTS=pr.data;}catch(_){}
  try{
    var pv=await sbFrom('product_store_visibility').select('product_id,store_id,is_visible').limit(9999);
    if(!pv.error&&pv.data){
      PSV={};
      pv.data.filter(function(r){return r.is_visible;}).forEach(function(r){
        if(!PSV[r.product_id])PSV[r.product_id]=[];
        PSV[r.product_id].push(r.store_id);
      });
    }
  }catch(_){}
}

  STORES.forEach(function(s){var el=$('pv-'+s.id);if(el)el.checked=sel;});

async function saveProd(pid){
  var name=($('pf-name').value||'').trim();
  var catId=parseInt($('pf-cat').value)||0;
  var unit=($('pf-unit').value||'').trim();
  var minQty=parseFloat($('pf-min').value)||1;
  var dispOrd=parseInt($('pf-ord').value)||10;
  var memo=($('pf-memo').value||'').trim();
  var freq=$('pf-freq').checked;
  var errEl=$('pf-err');
  if(!name){errEl.innerHTML='<div class="al ae"><i class="ti ti-alert-circle"></i><span>商品名を入力してください</span></div>';return;}
  if(!catId){errEl.innerHTML='<div class="al ae"><i class="ti ti-alert-circle"></i><span>カテゴリーを選択してください</span></div>';return;}
  if(!unit){errEl.innerHTML='<div class="al ae"><i class="ti ti-alert-circle"></i><span>単位を入力してください</span></div>';return;}
  var vis=STORES.filter(function(s){var el=$('pv-'+s.id);return el&&el.checked;}).map(function(s){return s.id;});
  var cat=CATS.find(function(c){return c.id===catId;});
  var payload={name:name,category_id:catId,category_name:cat?cat.name:'',unit:unit,min_qty:minQty,display_order:dispOrd,memo:memo,is_frequent:freq,is_active:true};
  var btn=$('pf-save');if(btn)btn.disabled=true;
  errEl.innerHTML='<div class="cbox cb-if"><div class="sp spsm"></div><span>保存中…</span></div>';
  try{
    var savedId=pid;
    if(!isReady){
      if(pid){var idx=PRODUCTS.findIndex(function(p){return p.id===pid;});if(idx>=0)PRODUCTS[idx]=Object.assign({},PRODUCTS[idx],payload);}
      else{var nid=Date.now();PRODUCTS.push(Object.assign({id:nid},payload));savedId=nid;}
      if(savedId){if(vis.length)PSV[savedId]=vis;else delete PSV[savedId];}
    }else{
      if(pid){
        var r=await sbFrom('products').update(Object.assign({},payload,{updated_at:new Date().toISOString()})).eq('id',pid);
        if(r.error)throw new Error(safeStr(r.error));savedId=pid;
      }else{
        var r2=await sbFrom('products').insert(payload).select();
        if(r2.error)throw new Error(safeStr(r2.error));
        if(!r2.data||!r2.data.length)throw new Error('商品の追加に失敗しました（IDが取得できません）');
        savedId=r2.data[0].id;
      }
      if(savedId){
        await sbFrom('product_store_visibility').delete().eq('product_id',savedId);
        if(vis.length){var rp=await sbFrom('product_store_visibility').insert(vis.map(function(sid){return{product_id:savedId,store_id:sid,is_visible:true};}));if(rp.error)console.warn('PSV保存失敗',safeStr(rp.error));}
      }
      await loadMaster();
    }
    S.modal=null;S.adminTab=1;var mc=$('_modal');if(mc)mc.remove();
    toast(pid?'商品を更新しました':'商品を追加しました');render();
  }catch(err){if(btn)btn.disabled=false;errEl.innerHTML='<div class="al ae"><i class="ti ti-alert-circle"></i><span>'+esc(safeStr(err))+'</span></div>';}
}
async function tglActive(pid,active){
  if(!confirm(active?'この商品を表示に戻しますか？':'この商品を非表示にしますか？'))return;
  try{
    var idx=PRODUCTS.findIndex(function(p){return p.id===pid;});
    if(idx>=0)PRODUCTS[idx].is_active=active;
    if(isReady){var r=await sbFrom('products').update({is_active:active,updated_at:new Date().toISOString()}).eq('id',pid);if(r.error)throw new Error(safeStr(r.error));await loadMaster();}
    S.adminTab=1;toast(active?'商品を表示に戻しました':'商品を非表示にしました');render();
  }catch(err){toast('更新失敗: '+safeStr(err),true);}
}
async function delProd(pid){
  if(!confirm('この商品を削除しますか？\n削除後は元に戻せません。\n「非表示」推奨です。'))return;
  try{
    PRODUCTS=PRODUCTS.filter(function(p){return p.id!==pid;});delete PSV[pid];
    if(isReady){await sbFrom('product_store_visibility').delete().eq('product_id',pid);var r=await sbFrom('products').delete().eq('id',pid);if(r.error)throw new Error(safeStr(r.error));}
    S.modal=null;S.adminTab=1;var mc=$('_modal');if(mc)mc.remove();toast('商品を削除しました');render();
  }catch(err){toast('削除失敗: '+safeStr(err),true);}
}

/* ── カテゴリーモーダル ── */
function openCat(cid){var c=cid?CATS.find(function(x){return x.id===cid;}):null;openModal('cat',{c:c});}
function mCat(d){
  var c=d.c,isNew=!c;
  return'<div class="modal-bg"><div class="modal" onclick="event.stopPropagation()">'
  +'<div class="mh"><div class="mtt">'+(isNew?'カテゴリーを追加':'カテゴリーを編集')+'</div><button class="xcl" onclick="closeModal()"><i class="ti ti-x"></i></button></div>'
  +'<div style="padding:16px;display:flex;flex-direction:column;gap:12px">'
  +'<div><label class="fl">カテゴリー名 <span style="color:var(--rd)">*</span></label>'
  +'<input type="text" class="fi" id="cf-name" value="'+esc(c?c.name:'')+'" placeholder="例：肉類"></div>'
  +'<div><label class="fl">表示順</label>'
  +'<input type="number" class="fi" id="cf-ord" value="'+(c?c.display_order:10)+'" min="0" step="10"></div>'
  +'<div id="cf-err" style="min-height:4px"></div>'
  +'<button class="btn bg" id="cf-save" onclick="saveCat('+(c?c.id:'null')+')">'
  +'<i class="ti ti-device-floppy"></i>'+(isNew?'追加する':'保存する')+'</button>'
  +(!isNew?'<button class="btn brd" onclick="delCat('+c.id+')"><i class="ti ti-trash"></i>削除する</button>':'')
  +'<button class="btn bgy" onclick="closeModal()"><i class="ti ti-arrow-left"></i>キャンセル</button>'
  +'</div></div></div>';
}
async function saveCat(cid){
  var name=($('cf-name').value||'').trim(),ord=parseInt($('cf-ord').value)||10,errEl=$('cf-err');
  if(!name){errEl.innerHTML='<div class="al ae"><i class="ti ti-alert-circle"></i><span>カテゴリー名を入力してください</span></div>';return;}
  var btn=$('cf-save');if(btn)btn.disabled=true;
  errEl.innerHTML='<div class="cbox cb-if"><div class="sp spsm"></div><span>保存中…</span></div>';
  try{
    if(!isReady){
      if(cid){var idx=CATS.findIndex(function(c){return c.id===cid;});if(idx>=0)CATS[idx]=Object.assign({},CATS[idx],{name:name,display_order:ord});}
      else CATS.push({id:Date.now(),name:name,display_order:ord,is_active:true});
    }else{
      var r=cid?await sbFrom('categories').update({name:name,display_order:ord,updated_at:new Date().toISOString()}).eq('id',cid)
               :await sbFrom('categories').insert({name:name,display_order:ord,is_active:true});
      if(r.error)throw new Error(safeStr(r.error));await loadMaster();
    }
    S.modal=null;S.adminTab=2;var mc=$('_modal');if(mc)mc.remove();toast(cid?'カテゴリーを更新しました':'カテゴリーを追加しました');render();
  }catch(err){if(btn)btn.disabled=false;errEl.innerHTML='<div class="al ae"><i class="ti ti-alert-circle"></i><span>'+esc(safeStr(err))+'</span></div>';}
}
async function delCat(cid){
  if(!confirm('このカテゴリーを削除しますか？'))return;
  try{
    CATS=CATS.filter(function(c){return c.id!==cid;});
    if(isReady){var r=await sbFrom('categories').delete().eq('id',cid);if(r.error)throw new Error(safeStr(r.error));await loadMaster();}
    S.modal=null;S.adminTab=2;var mc=$('_modal');if(mc)mc.remove();toast('カテゴリーを削除しました');render();
  }catch(err){toast('削除失敗: '+safeStr(err),true);}
}

/* ── 店舗別商品設定モーダル ── */
function openStoreProd(sid){openModal('sprods',{sid:sid});}
function mSProds(d){
  var store=STORES.find(function(s){return s.id===d.sid;});
  var prods=PRODUCTS.filter(function(p){return p.is_active!==false;});
  var vis=prods.filter(function(p){var v=PSV[p.id];return!v||v.length===0||v.indexOf(d.sid)>=0;}).map(function(p){return p.id;});
  var catMap={};CATS.forEach(function(c){catMap[c.id]=c;});
  var catIds=[];prods.forEach(function(p){if(catIds.indexOf(p.category_id)<0)catIds.push(p.category_id);});
  return'<div class="modal-bg"><div class="modal" onclick="event.stopPropagation()" style="max-height:95vh">'
  +'<div class="mh"><div><div class="mtt">'+esc(store?store.name:'')+' の商品設定</div>'
  +'<div style="font-size:12px;color:var(--mt);margin-top:2px">チェックした商品がこの店舗の発注画面に表示されます</div></div>'
  +'<button class="xcl" onclick="closeModal()"><i class="ti ti-x"></i></button></div>'
  +'<div style="padding:8px 12px;display:flex;gap:8px">'
  +'<button class="btn bg bsm" onclick="saveSP('+d.sid+')"><i class="ti ti-device-floppy"></i>保存する</button>'
  +'<button class="btn bgy bsm" onclick="closeModal()">キャンセル</button></div>'
  +(catIds.length?catIds.map(function(cid){
    var cat=catMap[cid]||{name:'その他'};
    var ps=prods.filter(function(p){return p.category_id===cid;});
    return'<div class="sl2">'+esc(cat.name)+'</div><div class="card" style="margin-top:0">'
    +ps.map(function(p){var chk=vis.indexOf(p.id)>=0;
      return'<div class="pi"><label style="display:flex;align-items:center;gap:10px;flex:1;cursor:pointer">'
        +'<input type="checkbox" id="sv-'+p.id+'" '+(chk?'checked':'')+' style="width:20px;height:20px;flex-shrink:0">'
        +'<div><div class="pn">'+esc(p.name)+'</div><div class="pu">'+esc(p.unit)+'</div></div></label></div>';
    }).join('')+'</div>';
  }).join(''):'<div class="emp">商品が登録されていません</div>')
  +'<div id="sperr" style="padding:0 12px;min-height:4px"></div>'
  +'<div style="padding:12px;display:flex;gap:8px">'
  +'<button class="btn bg bsm" onclick="saveSP('+d.sid+')" style="flex:1"><i class="ti ti-device-floppy"></i>保存する</button>'
  +'<button class="btn bgy bsm" onclick="closeModal()" style="flex:1">キャンセル</button></div>'
  +'</div></div>';
}
async function saveSP(sid){
  var errEl=$('sperr');
  var sel=PRODUCTS.filter(function(p){return p.is_active!==false&&$('sv-'+p.id)&&$('sv-'+p.id).checked;}).map(function(p){return p.id;});
  try{
    if(!isReady){
      PRODUCTS.filter(function(p){return p.is_active!==false;}).forEach(function(p){
        var cur=PSV[p.id]?PSV[p.id].slice():STORES.map(function(s){return s.id;});
        if(sel.indexOf(p.id)>=0){if(cur.indexOf(sid)<0)cur.push(sid);}
        else{var i=cur.indexOf(sid);if(i>=0)cur.splice(i,1);}
        PSV[p.id]=cur;
      });
    }else{
      await sbFrom('product_store_visibility').delete().eq('store_id',sid);
      if(sel.length){var r=await sbFrom('product_store_visibility').insert(sel.map(function(pid){return{product_id:pid,store_id:sid,is_visible:true};}));if(r.error)throw new Error(safeStr(r.error));}
      await loadMaster();
    }
    S.modal=null;S.adminTab=3;var mc=$('_modal');if(mc)mc.remove();
    toast((STORES.find(function(s){return s.id===sid;})||{}).name+'の商品設定を保存しました');render();
  }catch(err){if(errEl)errEl.innerHTML='<div class="al ae"><i class="ti ti-alert-circle"></i><span>'+esc(safeStr(err))+'</span></div>';}
}

/* ─── 共通パーツ・アクション ─── */
function lbtn(){return'<button onclick="doOut()" style="border:1px solid var(--br);border-radius:8px;padding:8px 12px;background:#fff;color:var(--mt);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:5px;font-weight:500"><i class="ti ti-logout" style="font-size:16px"></i>ログアウト</button>';}
function doOut(){
  if(autoTimer){clearInterval(autoTimer);autoTimer=null;}
  if(dateTimer){clearInterval(dateTimer);dateTimer=null;}
  S={view:'login',role:null,storeId:null,storeErr:'',phase:'home',qty:{},memo:'',catOpen:{},ckTab:0,detail:null,ckChecked:{},showHist:false,histOrders:[],todayOrders:[],adminTab:0,adminOrders:[],af:{from:'',to:'',sid:'',status:'',kw:''},submitting:false,modal:null,bootError:''};
  render();
}
function go(ph){S.phase=ph;render();}
function inc(id,mn){S.qty[id]=Math.round(((S.qty[id]||0)+mn)*1000)/1000;render();}
function dec(id,mn){S.qty[id]=Math.max(0,Math.round(((S.qty[id]||0)-mn)*1000)/1000);render();}
function setQ(id,v,mn){var n=parseFloat(v)||0;S.qty[id]=Math.max(0,Math.round(n/mn)*mn);render();}
function cp(){S.qty={};var prods=productsForStore(S.storeId);prods.slice(0,8).forEach(function(p){S.qty[p.id]=p.min_qty||1;});toast('前回発注をコピーしました（最小数量）');render();}
function cpA(){cp();S.phase='order';render();}
function goC(){var m=$('mi');if(m)S.memo=m.value.trim();S.phase='confirm';render();}

async function doSub(){
  if(S.submitting)return;S.submitting=true;
  var btn=$('sub');if(btn)btn.disabled=true;
  showL('発注をCKに送信中…');
  var items=PRODUCTS.filter(function(p){return(S.qty[p.id]||0)>0;}).map(function(p){return{product_id:p.id,product_name:p.name,quantity:S.qty[p.id],unit:p.unit};});
  var late=isLate(),st=SD();
  var pl={store_id:S.storeId,store_name:st.name,order_date:jst.iso,status:late?'late':'ordered',memo:S.memo||'',is_late:late,created_by:st.manager_name||'店長'};
  try{
    if(isReady){
      var r=await sbFrom('orders').insert(pl).select();
      if(r.error)throw new Error(safeStr(r.error));
      if(!r.data||!r.data.length)throw new Error('発注データのIDが取得できませんでした');
      var oid=r.data[0].id;
      if(items.length){var r2=await sbFrom('order_items').insert(items.map(function(i){return Object.assign({},i,{order_id:oid});}));if(r2.error)throw new Error(safeStr(r2.error));}
      S.todayOrders=S.todayOrders.filter(function(o){return o.store_id!==S.storeId;});
      S.todayOrders.push(Object.assign({},r.data[0],{items:items.map(function(i){return{product_name:i.product_name,quantity:i.quantity,unit:i.unit};})}));
    }else{
      var d=Object.assign({id:'d'+Date.now()},pl,{created_at:new Date().toISOString(),items:items.map(function(i){return{product_name:i.product_name,quantity:i.quantity,unit:i.unit};})});
      S.todayOrders=S.todayOrders.filter(function(o){return o.store_id!==S.storeId;});S.todayOrders.push(d);
    }
    hideL();S.submitting=false;S.phase='success';render();
  }catch(err){
    hideL();S.submitting=false;if(btn)btn.disabled=false;render();
    toast('発注の送信に失敗しました。通信環境を確認してもう一度送信してください。（'+safeStr(err)+'）',true);
  }
}
async function doNo(){
  if(S.submitting)return;S.submitting=true;showL('CKに連絡中…');
  var st=SD();
  var pl={store_id:S.storeId,store_name:st.name,order_date:jst.iso,status:'no_order',memo:'',is_late:false,created_by:st.manager_name||'店長'};
  try{
    if(isReady){var r=await sbFrom('orders').insert(pl).select();if(r.error)throw new Error(safeStr(r.error));S.todayOrders=S.todayOrders.filter(function(o){return o.store_id!==S.storeId;});S.todayOrders.push(Object.assign({},r.data[0],{items:[]}));}
    else{var d=Object.assign({id:'d'+Date.now()},pl,{created_at:new Date().toISOString(),items:[]});S.todayOrders=S.todayOrders.filter(function(o){return o.store_id!==S.storeId;});S.todayOrders.push(d);}
    hideL();S.submitting=false;S.phase='noorder_done';render();
  }catch(err){hideL();S.submitting=false;render();toast('送信失敗: '+safeStr(err),true);}
}
async function ckR(id){
  S.ckChecked[id+'_r']=true;
  if(isReady){var r=await sbFrom('orders').update({status:'ck_confirmed',updated_at:new Date().toISOString()}).eq('id',id);if(!r.error){var o=S.todayOrders.find(function(x){return x.id===id;});if(o)o.status='ck_confirmed';}}
  else{var o2=S.todayOrders.find(function(x){return x.id===id;});if(o2)o2.status='ck_confirmed';}
  render();
}
async function ckS(id){
  S.ckChecked[id+'_r']=true;S.ckChecked[id+'_s']=true;
  if(isReady){var r=await sbFrom('orders').update({status:'shipped',updated_at:new Date().toISOString()}).eq('id',id);if(!r.error){var o=S.todayOrders.find(function(x){return x.id===id;});if(o)o.status='shipped';}}
  else{var o2=S.todayOrders.find(function(x){return x.id===id;});if(o2)o2.status='shipped';}
  render();
}
async function opH(){showL('過去の履歴を読み込み中…');await fetchHist();hideL();S.showHist=true;render();}
async function doRef(){showL('最新データを取得中…');await fetchToday();hideL();render();toast('更新しました');}
async function adRef(){showL('データを読み込み中…');await fetchAdmin();hideL();render();toast('更新しました');}
function clrF(){var t=jst.iso,mo=new Date();mo.setDate(mo.getDate()-30);S.af={from:mo.toISOString().slice(0,10),to:t,sid:'',status:'',kw:''};render();}
function doCSV(){
  var rows=[['発注日','店舗名','商品名','数量','単位','ステータス','締切後','メモ','発注時間','CK確認','出荷']];
  S.adminOrders.forEach(function(o){
    var t=new Date(o.created_at).toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'});
    var sl=sMeta(o.status).l,ck=o.status==='ck_confirmed'||o.status==='shipped'?'済':'未',sh=o.status==='shipped'?'済':'未';
    if(!o.items||!o.items.length)rows.push([o.order_date,o.store_name,'（発注なし）','','',sl,o.is_late?'はい':'いいえ',o.memo||'',t,ck,sh]);
    else o.items.forEach(function(i){rows.push([o.order_date,o.store_name,i.product_name,i.quantity,i.unit,sl,o.is_late?'はい':'いいえ',o.memo||'',t,ck,sh]);});
  });
  var csv='\uFEFF'+rows.map(function(r){return r.map(function(v){return'"'+String(v||'').replace(/"/g,'""')+'"';}).join(',');}).join('\r\n');
  var url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  var a=document.createElement('a');a.href=url;a.download='発注履歴_'+jst.iso+'.csv';a.click();
  URL.revokeObjectURL(url);toast('CSVをダウンロードしました（'+rows.length+'行）');
}

/* ─── 起動処理 ─── */
(async function boot(){
  var sv=lCfg();
  var cu=cleanUrl(SUPABASE_URL||''),ck=(SUPABASE_ANON_KEY||'').trim().replace(/\s/g,'');
  var url=cu||cleanUrl(sv.url||''),key=ck||(sv.anonKey||'').trim();
  if(url&&key){
    showL('Supabaseに自動接続中…');
    var r;try{r=await initSB(url,key);}catch(e){r={ok:false,errorMsg:safeStr(e)};}
    hideL();
    if(r&&r.ok){sCfg(url,key);S.view='login';}
    else{S.view='setup';S.bootError=jpErr((r&&r.errorMsg)||'接続失敗');}
  }else{S.view='setup';}
  startDW();render();
})();
</script>
