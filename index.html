  display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.bar-t{font-size:17px;font-weight:600;flex:1;line-height:1.2}
.bar-s{font-size:12px;color:var(--m);margin-top:1px}
.con{flex:1;padding-bottom:calc(72px + var(--sb))}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
  background:#fff;border-top:1px solid var(--br);display:flex;z-index:100;
  padding-bottom:var(--sb)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;
  cursor:pointer;color:var(--h);font-size:11px;border:none;background:none;
  min-height:56px;justify-content:center;transition:color .15s}
.nb.on{color:var(--g)}
.nb i{font-size:24px}

/* SETUP */
.setup{display:flex;flex-direction:column;align-items:center;min-height:100vh;
  padding:36px 20px 32px;background:linear-gradient(160deg,#FAEEDA 0%,#EDE9E3 50%)}
.sc{background:#fff;border-radius:var(--R);border:1px solid var(--br);
  padding:22px;width:100%;max-width:420px}
.tx{width:100%;padding:12px 14px;border:1.5px solid var(--br);border-radius:var(--r8);
  font-size:14px;color:var(--t);background:#fff;outline:none;margin-bottom:10px;
  font-family:monospace;transition:border-color .15s;
  -webkit-appearance:none;word-break:break-all}
.tx:focus{border-color:var(--g)}
.cbox{border-radius:var(--r8);padding:12px 14px;display:flex;gap:9px;
  align-items:flex-start;border:1px solid;font-size:13px;margin-bottom:10px;
  line-height:1.7;word-break:break-word}
.cbox i{flex-shrink:0;font-size:18px;margin-top:2px}
.c-ok{background:var(--gl);color:var(--gd);border-color:var(--gm)}
.c-w{background:var(--ol);color:var(--od);border-color:#FAC775}
.c-e{background:var(--rl);color:#791F1F;border-color:#F7C1C1}
.c-i{background:var(--bl);color:var(--bd);border-color:#B5D4F4}

/* LOGIN */

.sl{font-size:12px;font-weight:600;color:var(--m);text-transform:uppercase;

.bb{background:#fff;color:var(--b);border:1.5px solid var(--b)}.bb:active{background:var(--bl)}
.bsm{padding:9px 13px;font-size:13px;width:auto;border-radius:6px;font-weight:500}

.ai{background:var(--bl);color:var(--bd);border-color:#B5D4F4}

.dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.st{font-size:15px;font-weight:600;flex:1}
.ss{font-size:12px;color:var(--m);margin-top:2px}

.sr{display:flex;align-items:center;gap:12px;padding:14px 16px;

/* PRODUCTS */
.cath{padding:10px 16px;background:var(--sf);display:flex;align-items:center;

.ckr{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--br)}
.ckr:last-child{border-bottom:none}
.cb{width:30px;height:30px;border-radius:6px;border:2px solid var(--br);

.cb.on{background:var(--g);border-color:var(--g);color:#fff}

.ro{display:flex;align-items:center;padding:11px 16px;border-bottom:1px solid var(--br);gap:10px}

.rn{flex:1;font-size:15px}
.rq{font-size:15px;font-weight:600;color:var(--g);white-space:nowrap}

/* STATS */
.sg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px 12px 4px}
.sc2{background:var(--sf);border-radius:var(--r8);padding:13px 14px;border:1px solid var(--br)}
.sl3{font-size:12px;color:var(--m);margin-bottom:4px;font-weight:500}
.sv{font-size:24px;font-weight:700}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end}
.sh{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:520px;
  margin:0 auto;max-height:90vh;overflow-y:auto;
  padding-bottom:calc(24px + var(--sb));animation:su .22s ease}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.shh{padding:16px;display:flex;align-items:center;border-bottom:1px solid var(--br);
  position:sticky;top:0;background:#fff;z-index:10}
.sht{font-size:18px;font-weight:600;flex:1}
.xcl{border:none;background:none;font-size:26px;color:var(--h);cursor:pointer;
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%}

/* SUCCESS */
.sw{display:flex;flex-direction:column;align-items:center;padding:48px 24px 32px;text-align:center}
.si{width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.sh2{font-size:24px;font-weight:700;margin-bottom:8px}

/* TOAST */
.toast{position:fixed;bottom:calc(88px + var(--sb));left:50%;transform:translateX(-50%);
  background:#2C2C2A;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;
  font-weight:500;z-index:300;pointer-events:none;opacity:0;transition:opacity .3s;
  max-width:90vw;text-align:center}
.toast.on{opacity:1}

.rdot{width:8px;height:8px;border-radius:50%;background:var(--g);display:inline-block;
  margin-right:4px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.px12{padding:0 12px}.fc{display:flex;flex-direction:column}.g8{gap:8px}.g10{gap:10px}
.emp{padding:40px 24px;text-align:center;color:var(--m);font-size:14px}

@media(min-width:560px){
  body{background:#d8d4ce}
  .app{margin:24px auto;border-radius:16px;min-height:calc(100vh - 48px)}
  .nav{border-radius:0 0 16px 16px;left:auto;transform:none;position:sticky;bottom:0}
  .con{max-height:calc(100vh - 160px);overflow-y:auto}
  .tabs{top:66px}
}
</style>

<script>
'use strict';

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

const LC = [

const LP = [
  {id:1, name:'ヒレカツ肉',           category:'meat',  unit:'kg', min_qty:0.5,is_frequent:true },
  {id:2, name:'ロースカツ肉',         category:'meat',  unit:'kg', min_qty:0.5,is_frequent:true },

  {id:11,name:'エビフライ（冷凍）',   category:'frozen',unit:'袋', min_qty:1,  is_frequent:true },
  {id:12,name:'コーンフライ（冷凍）', category:'frozen',unit:'袋', min_qty:1,  is_frequent:false},
  {id:13,name:'醤油',                 category:'sauce', unit:'本', min_qty:1,  is_frequent:true },

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
let SB = null;           // Supabase createClient の返り値
let isReady = false;     // Supabase接続成功フラグ
let STORES   = [...LS];

const CATS = LC;
let autoTimer = null;
let dateTimer = null;

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   日本時間ユーティリティ
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function getJST() {
  const p = new Intl.DateTimeFormat('ja-JP',{
    timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'
  }).formatToParts(new Date());
  return {
    iso: `${p.find(x=>x.type==='year').value}-${p.find(x=>x.type==='month').value}-${p.find(x=>x.type==='day').value}`,
    get disp() {
      const [y,m,d]=this.iso.split('-').map(Number);
      const w=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',weekday:'short'}).format(new Date(y,m-1,d));
      return `${y}年${m}月${d}日（${w}）`;
    }
  };
}
let jst = getJST();

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   URL正規化
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function cleanUrl(raw) {
  return (raw||'').trim()
    .replace(/\r?\n/g,'')         // 改行除去
    .replace(/\s/g,'')            // 空白除去
    .replace(/\/rest\/v1.*$/,'')  // /rest/v1以降を除去
    .replace(/\/+$/,'')           // 末尾スラッシュ除去
    .replace(/^http:\/\//,'https://') // https化
    .replace(/^(?!https?:\/\/)/,'https://'); // スキーム補完
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   エラーメッセージ → 日本語
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function jp(e) {
  const msg = String((e&&(e.message||e.hint||e.details||e.error_description))||'');
  if (!msg) return '原因不明のエラーが発生しました。コンソールをご確認ください。';

  if (msg.includes('Failed to fetch') || msg.includes('NetworkError') || msg.includes('fetch'))
    return [
      '通信エラー（Failed to fetch）',
      '',
      '【よくある原因と対処法】',
      '① ローカル/プレビューで開いている',
      '　→ Vercelで公開したURLで開いてください',
      '　　（localhost やファイルパスでは接続できません）',
      '',
      '② URLが間違っている',
      '　→ Supabase > Settings > API の',
      '　　「Project URL」を正確にコピーしてください',
      '　→ 正しい形式: https://xxxxx.supabase.co',
      '',
      '③ ネットワーク問題',
      '　→ Wi-Fi ↔ モバイル回線を切り替えてみてください',
    ].join('\n');

  if (msg.includes('Invalid API key') || msg.includes('401') || msg.includes('invalid_jwt'))
    return [
      'Anon Keyが正しくありません（401エラー）',
      '',
      '・Supabase > Settings > API',
      '・「anon public」の「Copy」ボタンでコピー',
      '・「service_role」は絶対に使わないでください',
      '・「Legacy anon public key」でもOKです',
    ].join('\n');

  if (msg.includes('403') || msg.includes('row-level security') || msg.includes('policy'))
    return [
      'RLS（行レベルセキュリティ）でブロックされています（403エラー）',
      '',
      '解決方法:',
      'Supabase > SQL Editor で以下を実行してください:',
      '',
      'CREATE POLICY "allow_all_stores" ON stores',
      '  FOR ALL USING (true) WITH CHECK (true);',
      '',
      '（supabase_setup.sql を再実行すると全部まとめて設定できます）',
    ].join('\n');

  if (msg.includes('relation') || msg.includes('does not exist') || msg.includes('404'))
    return [
      'storesテーブルが存在しません（404エラー）',
      '',
      '解決方法:',
      'Supabase > SQL Editor で supabase_setup.sql を実行してください',
    ].join('\n');

  if (msg.includes('CORS') || msg.includes('Access-Control'))
    return [
      'CORSエラーが発生しています',
      '',
      'ローカル環境（localhost）からはSupabaseに',
      '接続できない場合があります。',
      'Vercelで公開したURLで接続してください。',
    ].join('\n');

  return `エラーが発生しました:\n${msg}`;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   Supabase 初期化
   ① window.supabase.createClient を使用
   ② 失敗時は fetch 直接呼び出しにフォールバック
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
async function initSB(url, key) {
  const u = cleanUrl(url);
  const k = (key||'').trim().replace(/\r?\n/g,'').replace(/\s/g,'');

  // --- 公式クライアント ---
  if (window.supabase && typeof window.supabase.createClient === 'function') {
    try {
      SB = window.supabase.createClient(u, k, {
        auth: { persistSession: false, autoRefreshToken: false },
      });
      // 接続テスト
      const { data, error } = await SB.from('stores').select('id,name').limit(1);
      if (error) throw error;
      // マスターデータ取得
      const [s, p] = await Promise.all([
        SB.from('stores').select('*').eq('is_active',true).order('display_order'),
        SB.from('products').select('*').eq('is_active',true).order('display_order'),
      ]);
      if (s.data && s.data.length) STORES = s.data;
      if (p.data && p.data.length) PRODUCTS = p.data;
      isReady = true;
      return { ok: true, via: 'createClient', stores: data };
    } catch(e) {
      SB = null; isReady = false;
      return { ok: false, via: 'createClient', error: e };
    }
  }

  // --- フォールバック: fetch 直接 ---
  try {
    const res = await fetch(`${u}/rest/v1/stores?select=id,name&limit=1`, {
      headers: { 'apikey': k, 'Authorization': `Bearer ${k}`, 'Content-Type': 'application/json' }
    });
    if (!res.ok) {
      const j = await res.json().catch(()=>({}));
      throw { message: `HTTP ${res.status}: ${j.message||j.hint||j.error||res.statusText}` };
    }
    const data = await res.json();
    // フォールバッククライアントを作成
    SB = makeFetch(u, k);
    isReady = true;
    return { ok: true, via: 'fetch', stores: data };
  } catch(e) {
    SB = null; isReady = false;
    return { ok: false, via: 'fetch', error: e };
  }
}

/* フォールバック fetch クライアント（Supabase JS と同じ API 形状） */
function makeFetch(url, key) {
  const H = { 'apikey':key, 'Authorization':`Bearer ${key}`, 'Content-Type':'application/json', 'Prefer':'return=representation' };
  const base = `${url}/rest/v1`;

  function chain(table) {
    let filters=[], _ord=null, _lim=null, _upd=null, _ins=null;
    const q = {
      select:  ()      => q,
      eq:      (c,v)   => { filters.push(`${c}=eq.${encodeURIComponent(v)}`); return q; },
      lt:      (c,v)   => { filters.push(`${c}=lt.${v}`); return q; },
      gte:     (c,v)   => { filters.push(`${c}=gte.${v}`); return q; },
      lte:     (c,v)   => { filters.push(`${c}=lte.${v}`); return q; },
      in:      (c,vs)  => { filters.push(`${c}=in.(${vs.join(',')})`); return q; },
      order:   (c,opt) => { _ord=`order=${c}.${(opt&&opt.ascending===false)?'desc':'asc'}`; return q; },
      limit:   (n)     => { _lim=`limit=${n}`; return q; },
      insert:  (d)     => { _ins=d; return q; },
      update:  (d)     => { _upd=d; return q; },
      then: (res, rej) => {
        const qs=[...filters,_ord,_lim].filter(Boolean).join('&');
        const ep=`${base}/${table}${qs?'?'+qs:''}`;
        let method='GET', body;
        if(_ins){ method='POST'; body=JSON.stringify(_ins); }
        if(_upd){ method='PATCH'; body=JSON.stringify(_upd); }
        fetch(ep,{method,headers:H,body})
          .then(async r=>{
            const txt=await r.text();
            const d=txt?JSON.parse(txt):[];
            if(!r.ok) return rej({data:null,error:{message:d.message||d.hint||r.statusText}});
            res({data:Array.isArray(d)?d:[d],error:null});
          })
          .catch(e=>rej({data:null,error:{message:e.message}}));
      }
    };
    return q;
  }
  return { from: (t) => chain(t) };
}

function cBox(type,msg){

/* ━━ 接続テスト ━━ */
async function doTest(){
  const rawU = $('sb-url').value;
  const rawK = $('sb-key').value;
  const box  = $('cst');

  if(!rawU.trim()||!rawK.trim()){box.innerHTML=cBox('e','URLとAnon Keyの両方を入力してください');return;}

  const u = cleanUrl(rawU);
  const k = rawK.trim().replace(/\r?\n/g,'').replace(/\s/g,'');

  // URL形式チェック
  if(!u.match(/^https:\/\/[a-z0-9]+\.supabase\.co$/i)){
    box.innerHTML=cBox('e',
      'URLの形式が正しくありません。\n正しい形式: https://xxxxx.supabase.co\n\n'
      +'Supabase > Settings > API の\n「Project URL」をコピーしてください。\n\n'
      +'現在の入力（正規化後）: '+u);
    return;
  }
  // Key形式チェック
  if(!k.startsWith('eyJ')){
    box.innerHTML=cBox('e',
      'Anon Keyの形式が正しくありません。\n「eyJ」で始まる文字列を入力してください。\n\n'
      +'Supabase > Settings > API の\n「anon public」をコピーしてください。\n'
      +'（「service_role」は使わないでください）');
    return;
  }

  // 正規化済みの値を表示
  $('sb-url').value = u;

  // Supabase JS ロード確認
  if(!window.supabase||!window.supabase.createClient){
    box.innerHTML=cBox('w',
      'Supabase JS ライブラリが読み込まれていません。\n'
      +'ページを再読み込みしてから試してください。\n'
      +'（インターネット接続を確認してください）');
    return;
  }

  box.innerHTML=`<div class="cbox c-i"><div class="sp spsm"></div>
    <span>接続テスト中…<br>storesテーブルに接続しています</span>
  </div>`;

  // ── 実際にSupabaseへ接続 ──
  const result = await initSB(u, k);

  if(result.ok){
    const stores = result.stores||[];
    const names  = Array.isArray(stores)?stores.map(s=>s.name||'?').join('、'):'';
    box.innerHTML=cBox('ok',
      'Supabase接続に成功しました ✓\n\n'
      +'接続先: '+u+'\n'
      +(names?'stores確認: '+names:'storesテーブル: 空（テーブルはあります）')+'\n'
      +'接続方式: '+result.via);
    sCfg(u, k);
    $('go-btn').disabled = false;
  } else {
    // 接続失敗 → エラー表示
    const errMsg = jp(result.error);
    box.innerHTML=cBox('e', errMsg);
  }
}

async function doStart(){
  const rawU=$('sb-url').value, rawK=$('sb-key').value;
  if(!rawU.trim()||!rawK.trim()){toast('URLとキーを入力してください',true);return;}
  const u=cleanUrl(rawU), k=rawK.trim().replace(/\r?\n/g,'').replace(/\s/g,'');
  sCfg(u,k);
  showL('Supabaseに接続中…');
  const r=await initSB(u,k);
  hideL();
  if(!r.ok){toast('接続失敗: '+jp(r.error).split('\n')[0],true);return;}
  S.view='login';render();
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   データ取得
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
async function fetchToday(){
  const today=jst.iso;
  if(!isReady||!SB){S.todayOrders=demoO();return;}
  try{
    const {data:orders,error:e1}=await SB.from('orders').select('*').eq('order_date',today).order('created_at',{ascending:false});
    if(e1)throw e1;
    let items=[];
    if(orders&&orders.length){
      const {data:ii,error:e2}=await SB.from('order_items').select('*').in('order_id',orders.map(o=>o.id));
      if(e2)throw e2;
      items=ii||[];
    }
    S.todayOrders=(orders||[]).map(o=>({...o,items:items.filter(i=>i.order_id===o.id)}));
  }catch(err){toast('データ取得エラー: '+jp(err).split('\n')[0],true);S.todayOrders=demoO();}
}

async function fetchAdmin(){
  if(!isReady||!SB){S.adminOrders=demoO();return;}
  try{
    const f=S.af;
    let q=SB.from('orders').select('*').order('order_date',{ascending:false}).limit(500);
    if(f.from)  q=q.gte('order_date',f.from);
    if(f.to)    q=q.lte('order_date',f.to);
    if(f.sid)   q=q.eq('store_id',parseInt(f.sid));
    if(f.status)q=q.eq('status',f.status);
    const {data:orders,error:e1}=await q;
    if(e1)throw e1;
    let items=[];
    if(orders&&orders.length){
      const {data:ii,error:e2}=await SB.from('order_items').select('*').in('order_id',orders.map(o=>o.id));
      items=ii||[];
    }
    let res=(orders||[]).map(o=>({...o,items:(items||[]).filter(i=>i.order_id===o.id)}));
    if(f.kw)res=res.filter(o=>o.store_name.includes(f.kw)||(o.memo||'').includes(f.kw)||(o.items||[]).some(i=>i.product_name.includes(f.kw)));
    S.adminOrders=res;
  }catch(err){toast('読み込みエラー: '+jp(err).split('\n')[0],true);S.adminOrders=[];}
}

async function fetchHist(){
  const today=jst.iso;
  if(!isReady||!SB){S.histOrders=[];return;}
  try{
    const {data:orders,error:e1}=await SB.from('orders').select('*').lt('order_date',today).order('order_date',{ascending:false}).limit(200);
    if(e1)throw e1;
    let items=[];
    if(orders&&orders.length){
      const {data:ii}=await SB.from('order_items').select('*').in('order_id',orders.map(o=>o.id));
      items=ii||[];
    }
    S.histOrders=(orders||[]).map(o=>({...o,items:items.filter(i=>i.order_id===o.id)}));
  }catch(_){S.histOrders=[];}
}

/* 日付監視 */
function startDW(){
  if(dateTimer)clearInterval(dateTimer);
  dateTimer=setInterval(()=>{
    const nd=getJST();
    if(nd.iso!==jst.iso){
      jst=nd;S.qty={};S.memo='';S.phase='home';S.todayOrders=[];
      if(S.view==='manager'||S.view==='ck')fetchToday().then(render);
    }
  },60000);
}
/* 自動ポーリング */
function startAR(){
  if(autoTimer)clearInterval(autoTimer);
  autoTimer=setInterval(()=>{if(S.view==='ck')fetchToday().then(render);},30000);

/* Realtime */
function subRT(){
  if(!isReady||!SB||!SB.channel)return;
  try{SB.channel('ord-ch').on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>fetchToday().then(render)).subscribe();}catch(_){}
}

function ckTo(){
  const tot={};
  S.todayOrders.filter(o=>o.status!=='no_order').forEach(o=>{
    (o.items||[]).forEach(i=>{
      const k=`${i.product_name}||${i.unit}`;
      const pr=PRODUCTS.find(p=>p.name===i.product_name);
      tot[k]=tot[k]||{name:i.product_name,unit:i.unit,qty:0,cat:pr?pr.category:'other'};
      tot[k].qty+=Number(i.quantity);
    });
  });
  const n=S.todayOrders.filter(o=>o.status!=='no_order').length;
  let h=`<div style="padding:10px 12px 4px;font-size:13px;color:var(--m)">発注店舗の合計（本日 ${n}店舗）</div>`;
  if(!Object.keys(tot).length)return h+`<div class="emp">本日の発注データがありません</div>`;
  CATS.forEach(cat=>{
    const items=Object.values(tot).filter(t=>t.cat===cat.id);
    if(!items.length)return;
    h+=`<div class="sl2" style="display:flex;align-items:center;gap:6px"><i class="ti ${cat.icon}" style="font-size:15px;color:var(--g)"></i>${cat.name}</div>

    </div>`;
  });
  return h;
}

async function doSub(){
  if(S.submitting)return;
  S.submitting=true;const btn=$('sub');if(btn)btn.disabled=true;
  showL('発注をCKに送信中…');
  const items=PRODUCTS.filter(p=>(S.qty[p.id]||0)>0).map(p=>({product_id:p.id,product_name:p.name,quantity:S.qty[p.id],unit:p.unit}));
  const late=isLate(), st=SD();
  const pl={store_id:S.storeId,store_name:st.name,order_date:jst.iso,status:late?'late':'ordered',memo:S.memo||'',is_late:late,created_by:st.manager_name||'店長'};
  try{
    if(isReady&&SB){
      const {data:ord,error:e1}=await SB.from('orders').insert(pl).select();
      if(e1)throw e1;
      const oid=ord[0].id;
      if(items.length){const {error:e2}=await SB.from('order_items').insert(items.map(i=>({...i,order_id:oid})));if(e2)throw e2;}
      S.todayOrders=S.todayOrders.filter(o=>o.store_id!==S.storeId);
      S.todayOrders.push({...ord[0],items:items.map(i=>({product_name:i.product_name,quantity:i.quantity,unit:i.unit}))});
    }else{
      const d={id:'d'+Date.now(),...pl,created_at:new Date().toISOString(),items:items.map(i=>({product_name:i.product_name,quantity:i.quantity,unit:i.unit}))};
      S.todayOrders=S.todayOrders.filter(o=>o.store_id!==S.storeId);S.todayOrders.push(d);
    }
    hideL();S.submitting=false;S.phase='success';render();
  }catch(err){
    hideL();S.submitting=false;if(btn)btn.disabled=false;render();
    toast('発注の送信に失敗しました。\n通信環境を確認してもう一度送信してください。\n（'+jp(err).split('\n')[0]+'）',true);
  }
}

async function doNo(){
  if(S.submitting)return;S.submitting=true;showL('CKに連絡中…');
  const st=SD();
  const pl={store_id:S.storeId,store_name:st.name,order_date:jst.iso,status:'no_order',memo:'',is_late:false,created_by:st.manager_name||'店長'};
  try{

      S.todayOrders=S.todayOrders.filter(o=>o.store_id!==S.storeId);S.todayOrders.push({...ord[0],items:[]});
    }else{
      const d={id:'d'+Date.now(),...pl,created_at:new Date().toISOString(),items:[]};
      S.todayOrders=S.todayOrders.filter(o=>o.store_id!==S.storeId);S.todayOrders.push(d);
    }
    hideL();S.submitting=false;S.phase='noorder_done';render();
  }catch(err){hideL();S.submitting=false;render();toast('送信失敗: '+jp(err).split('\n')[0],true);}
}

async function ckR(id){
  S.ckChecked[id+'_r']=true;
  if(isReady&&SB){const {error}=await SB.from('orders').update({status:'ck_confirmed',ck_ready_at:new Date().toISOString()}).eq('id',id);if(!error){const o=S.todayOrders.find(x=>x.id===id);if(o)o.status='ck_confirmed';}}
  else{const o=S.todayOrders.find(x=>x.id===id);if(o)o.status='ck_confirmed';}
  render();
}
async function ckS(id){
  S.ckChecked[id+'_r']=true;S.ckChecked[id+'_s']=true;
  if(isReady&&SB){const {error}=await SB.from('orders').update({status:'shipped',shipped_at:new Date().toISOString()}).eq('id',id);if(!error){const o=S.todayOrders.find(x=>x.id===id);if(o)o.status='shipped';}}
  else{const o=S.todayOrders.find(x=>x.id===id);if(o)o.status='shipped';}
  render();
}

function doCSV(){
  const rows=[['発注日','店舗名','商品名','数量','単位','ステータス','締切後','メモ','発注時間','CK確認','出荷']];
  S.adminOrders.forEach(o=>{
    const t=new Date(o.created_at).toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'});
    const sl=sMeta(o.status).l, ck=o.status==='ck_confirmed'||o.status==='shipped'?'済':'未', sh=o.status==='shipped'?'済':'未';
    if(!o.items||!o.items.length)rows.push([o.order_date,o.store_name,'（発注なし）','','',sl,o.is_late?'はい':'いいえ',o.memo||'',t,ck,sh]);
    else o.items.forEach(i=>rows.push([o.order_date,o.store_name,i.product_name,i.quantity,i.unit,sl,o.is_late?'はい':'いいえ',o.memo||'',t,ck,sh]));
  });
  const csv='\uFEFF'+rows.map(r=>r.map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download=`発注履歴_${jst.iso}.csv`;a.click();
  URL.revokeObjectURL(url);toast('CSVをダウンロードしました（'+rows.length+'行）');
}

(async function boot(){
  // コードに直書きされた値 OR localStorage保存済みの値を使う
  const saved = lCfg();
  const url = cleanUrl(SUPABASE_URL || saved.url || '');
  const key = ((SUPABASE_ANON_KEY||'').trim().replace(/\s/g,'')) || ((saved.anonKey||'').trim());

  if(url && key){
    showL('Supabaseに接続中…');
    const r = await initSB(url, key);
    hideL();
    if(r.ok){
      sCfg(url, key);
      S.view = 'login';
    }
    // 接続失敗でもsetup画面を表示（理由をユーザーが確認できる）
  }
  startDW();
  render();
})();
