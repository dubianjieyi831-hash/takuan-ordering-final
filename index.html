<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<div id="modal-wrap"></div>
<script>
'use strict';
/* ========================================================
   ★ ここにSupabaseの接続情報を入力してください ★
   Supabase → Settings → API から取得
======================================================== */
var SB_URL = 'https://dlkilajbabzbmbpratnq.supabase.co'; // Project URL
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRsa2lsYWpiYWJ6Ym1icHJhdG5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5ODIxOTksImV4cCI6MjA5NjU1ODE5OX0.zUqBH_5Boh1_NL98HinpQ8lGIK9GAujvra-FdXRdzO4'; 
/* ======== グローバル変数 ======== */
var _url = '', _key = '', isReady = false;
var STORES = [], CATS = [], PRODUCTS = [], PSV = {}; // PSV: {product_id(num): [store_id(num),...]}
var autoTimer = null, dateTimer = null;

/* ======== ユーティリティ ======== */
function getJST(){
  var p=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  var y=p.find(function(x){return x.type==='year';}).value;
  var mo=p.find(function(x){return x.type==='month';}).value;
  var d=p.find(function(x){return x.type==='day';}).value;
  var iso=y+'-'+mo+'-'+d;
  var w=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',weekday:'short'}).format(new Date(+y,+mo-1,+d));
  return{iso:iso,disp:(+y)+'年'+(+mo)+'月'+(+d)+'日（'+w+'）'};
}
var jst = getJST();
var $ = function(id){return document.getElementById(id);};
var esc = function(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');};
function safeMsg(err){
  if(!err)return'不明なエラー';
  if(typeof err==='string')return err;
  if(err instanceof Error)return err.message||String(err);
  if(typeof err==='object'){var m=err.message||err.hint||err.details||err.error||'';if(m&&typeof m==='string')return m;try{return JSON.stringify(err);}catch(_){}}
  return String(err);
}
function cleanUrl(raw){
  return(raw||'').replace(/[\s\r\n]/g,'').replace(/\/rest\/v1.*$/,'').replace(/\/+$/,'').replace(/^http:\/\//,'https://');
}
function toast(msg,isErr){
  var t=$('toast');if(!t)return;
  t.textContent=msg;t.style.background=isErr?'#E24B4A':'#2C2C2A';
  t.classList.add('on');setTimeout(function(){t.classList.remove('on');},isErr?4500:2500);
}
function showL(txt){
  var el=$('_lov');
  if(!el){el=document.createElement('div');el.id='_lov';el.className='lov';document.body.appendChild(el);}
  el.innerHTML='<div class="sp"></div><div style="font-size:14px;color:var(--m);font-weight:500">'+esc(txt||'処理中…')+'</div>';
}
function hideL(){var el=$('_lov');if(el)el.remove();}

/* ======== safeFetch（DataCloneError完全防止） ======== */
function safeFetch(url, opts){
  return new Promise(function(resolve){
    var res={ok:false,status:0,body:'',err:''};
    fetch(url,opts).then(function(r){
      res.ok=r.ok; res.status=r.status;
      r.text().then(function(t){res.body=t;resolve(res);}).catch(function(){resolve(res);});
    }).catch(function(e){
      res.err=(e instanceof Error)?e.message:String(e||'ネットワークエラー');
      resolve(res);
    });
  });
}

/* ======== Supabase REST クライアント ======== */
function Q(tbl){this._t=tbl;this._f=[];this._ord=null;this._lim=null;this._m='GET';this._bdy=null;this._sel='*';}
Q.prototype.select=function(c){this._sel=c||'*';return this;};
Q.prototype.eq=function(c,v){this._f.push(c+'=eq.'+encodeURIComponent(String(v)));return this;};
Q.prototype.lt=function(c,v){this._f.push(c+'=lt.'+encodeURIComponent(String(v)));return this;};
Q.prototype.lte=function(c,v){this._f.push(c+'=lte.'+encodeURIComponent(String(v)));return this;};
Q.prototype.gte=function(c,v){this._f.push(c+'=gte.'+encodeURIComponent(String(v)));return this;};
Q.prototype.in=function(c,vs){this._f.push(c+'=in.('+vs.map(String).join(',')+')');return this;};
Q.prototype.order=function(c,opts){this._ord=c+'.'+((opts&&opts.ascending===false)?'desc':'asc');return this;};
Q.prototype.limit=function(n){this._lim=n;return this;};
Q.prototype.insert=function(d){this._m='POST';this._bdy=d;return this;};
Q.prototype.update=function(d){this._m='PATCH';this._bdy=d;return this;};
Q.prototype.delete=function(){this._m='DELETE';return this;};
Q.prototype.then=function(resolve){
  return this._exec().then(resolve).catch(function(ex){
    resolve({data:null,error:{message:(ex instanceof Error)?ex.message:String(ex||'エラー')}});
  });
};
Q.prototype._exec=function(){
  var self=this;
  return new Promise(function(resolve){
    if(!_url||!_key){resolve({data:null,error:{message:'Supabase未接続'}});return;}
    var parts=[];
    if(self._sel&&(self._m==='GET'||self._m==='POST'))parts.push('select='+self._sel);
    self._f.forEach(function(f){parts.push(f);});
    if(self._ord)parts.push('order='+self._ord);
    if(self._lim)parts.push('limit='+self._lim);
    var qs=parts.length?'?'+parts.join('&'):'';
    safeFetch(_url+'/rest/v1/'+self._t+qs,{
      method:self._m,
      headers:{'Content-Type':'application/json','apikey':_key,'Authorization':'Bearer '+_key,'Prefer':'return=representation'},
      body:self._bdy!=null?JSON.stringify(self._bdy):undefined
    }).then(function(r){
      if(r.err){resolve({data:null,error:{message:r.err}});return;}
      if(!r.ok){
        var em='HTTP '+r.status;
        try{var j=JSON.parse(r.body);em=j.message||j.hint||j.error||em;}catch(_){}
        resolve({data:null,error:{message:String(em)}});return;
      }
      var data=[];
      try{var p=r.body?JSON.parse(r.body):null;data=Array.isArray(p)?p:(p?[p]:[]);}catch(_){}
      resolve({data:data,error:null});
    });
  });
};
var DB={from:function(tbl){return new Q(tbl);}};

/* ======== マスターデータ取得（safeFetch直接使用でDB.thenのawait問題を回避） ======== */
async function loadMaster(){
  if(!isReady)return;
  var h={'Content-Type':'application/json','apikey':_key,'Authorization':'Bearer '+_key};
  // stores
  try{
    var rs=await safeFetch(_url+'/rest/v1/stores?select=*&order=display_order.asc&limit=100',{method:'GET',headers:h});
    if(!rs.err&&rs.ok){var d=JSON.parse(rs.body||'[]');if(Array.isArray(d)&&d.length)STORES=d.map(function(s){return Object.assign({},s,{id:Number(s.id)});});}
  }catch(_){}
  // categories
  try{
    var rc=await safeFetch(_url+'/rest/v1/categories?select=*&is_active=eq.true&order=display_order.asc&limit=100',{method:'GET',headers:h});
    if(!rc.err&&rc.ok){var d=JSON.parse(rc.body||'[]');if(Array.isArray(d))CATS=d.map(function(c){return Object.assign({},c,{id:Number(c.id)});});}
  }catch(_){}
  // products
  try{
    var rp=await safeFetch(_url+'/rest/v1/products?select=*&order=display_order.asc&limit=1000',{method:'GET',headers:h});
    if(!rp.err&&rp.ok){var d=JSON.parse(rp.body||'[]');if(Array.isArray(d))PRODUCTS=d.map(function(p){return Object.assign({},p,{id:Number(p.id),category_id:p.category_id?Number(p.category_id):null});});}
  }catch(_){}
  // PSV
  try{
    var rv=await safeFetch(_url+'/rest/v1/product_store_visibility?select=product_id,store_id,is_visible&limit=5000',{method:'GET',headers:h});
    if(!rv.err&&rv.ok){
      var d=JSON.parse(rv.body||'[]');
      PSV={};
      if(Array.isArray(d)){d.filter(function(r){return r.is_visible;}).forEach(function(r){
        var pid=Number(r.product_id),sid=Number(r.store_id);
        if(!PSV[pid])PSV[pid]=[];
        PSV[pid].push(sid);
      });}
    }
  }catch(_){}
}

/* ======== 接続初期化 ======== */
async function initSB(url,key){
  var u=cleanUrl(url), k=(key||'').replace(/[\s\r\n]/g,'');
  if(!u||!k)return{ok:false,msg:'URLとAnon Keyを入力してください'};

  // sb_publishable_ 形式（新形式）とeyJ形式（JWT）の両方に対応
  // 新形式: apikey と Authorization の両方に同じキーを送る（従来通り）
  var headers={
    'Content-Type':'application/json',
    'apikey':k,
    'Authorization':'Bearer '+k
  };

  var r=await safeFetch(u+'/rest/v1/stores?select=id&limit=1',{method:'GET',headers:headers});

  // 詳細なエラー情報を取得
  var bodyDetail='';
  try{var bd=JSON.parse(r.body||'{}');bodyDetail=bd.message||bd.hint||bd.error||bd.msg||'';}catch(_){}

  if(r.err)return{ok:false,msg:'ネットワークエラー: '+r.err+'\n（Vercel公開URLでのみ接続できます）'};
  if(r.status===200||r.status===206){
    _url=u;_key=k;isReady=true;
    await loadMaster();
    return{ok:true};
  }
  if(r.status===401)return{ok:false,msg:'HTTP 401: Anon Keyが認証されませんでした。\n\n【確認事項】\n① Supabase → Settings → API → anon public（publicと書かれた方）をコピー\n② service_role keyを使っていないか確認\n③ キーが途中で切れていないか確認\n\n詳細: '+(bodyDetail||'（なし）')};
  if(r.status===403)return{ok:false,msg:'HTTP 403: RLSポリシーエラー。\nsupabase_final.sqlを再実行してください。\n詳細: '+(bodyDetail||'（なし）')};
  if(r.status===404)return{ok:false,msg:'HTTP 404: storesテーブルがありません。\nsupabase_final.sqlを実行してください。'};
  return{ok:false,msg:'HTTP '+r.status+(bodyDetail?': '+bodyDetail:'')};
}

var SD=function(){return STORES.find(function(s){return Number(s.id)===Number(S.storeId);});};
/* 発注対象日（空なら今日）を返す */
function getOrderDate(){return S.orderDate||jst.iso;}
/* 発注対象日の表示文字列を返す */
function getOrderDateDisp(iso){
  if(!iso)iso=getOrderDate();
  var p=iso.split('-').map(Number);var y=p[0],mo=p[1],d=p[2];
  var w=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',weekday:'short'}).format(new Date(y,mo-1,d));
  return y+'年'+mo+'月'+d+'日（'+w+'）';
}
function getStore(){
  var st=SD();
  if(!st)st=STORES.find(function(s){return String(s.id)===String(S.storeId);});
  if(!st)st={id:S.storeId,name:'店舗',short_name:'',deadline_time:'10:00',manager_name:''};
  return st;
}
function isLate(){
  var st=SD();if(!st||!st.deadline_time)return false;
  var p=(st.deadline_time||'10:00').split(':').map(Number);
  var n=new Date();return n.getHours()*60+n.getMinutes()>=p[0]*60+p[1];
}
function productsForStore(sid){
  var s=Number(sid);
  var hasPSV=Object.keys(PSV).length>0;
  return PRODUCTS.filter(function(p){
    if(p.is_active===false)return false;
    if(!hasPSV)return true;
    var vis=PSV[Number(p.id)];
    if(!vis||vis.length===0)return true;
    return vis.indexOf(s)>=0;
  });
}
function sMeta(st){
  if(st==='ordered')    return{l:'本日発注あり',   b:'bok', d:'#1D9E75'};
  if(st==='late')       return{l:'締切後発注',      b:'blate',d:'#EF9F27'};
  if(st==='no_order')   return{l:'発注なし（連絡済）',b:'bnone',d:'#378ADD'};
  if(st==='ck_confirmed')return{l:'CK確認済み',    b:'bck', d:'#378ADD'};
  if(st==='shipped')    return{l:'出荷済み',        b:'bship',d:'#1D9E75'};
  return{l:'未確認',b:'bunc',d:'#B4B2A9'};
}

async function doInlineConnect(){
  var keyEl=$('inline-key');
  var errEl=$('inline-err');
  var k=keyEl?(keyEl.value||'').replace(/[\s\r\n]/g,''):'';
  if(!k){if(errEl)errEl.innerHTML='<div style="color:#791F1F;font-size:12px">Anon Keyを入力してください</div>';return;}
  var u=(SB_URL||'').replace(/[\s\r\n]/g,'');
  if(!u){if(errEl)errEl.innerHTML='<div style="color:#791F1F;font-size:12px">SB_URLが設定されていません</div>';return;}
  var btn=document.querySelector('[onclick="doInlineConnect()"]');
  if(btn)btn.disabled=true;
  if(errEl)errEl.innerHTML='<div style="font-size:12px;color:#0F6E56">接続中…</div>';
  var r=await initSB(u,k);
  if(r.ok){
    S.connErr='';render();

    if(btn)btn.disabled=false;
    if(errEl)errEl.innerHTML='<div style="color:#791F1F;font-size:12px;white-space:pre-wrap">'+esc(r.msg||'接続失敗')+'</div>';

}

/* ======== データ取得（safeFetch直接使用・awaitフリーズ防止） ======== */
async function fetchToday(){
  var today=jst.iso;
  if(!isReady){S.todayOrders=[];return;}
  var h={'Content-Type':'application/json','apikey':_key,'Authorization':'Bearer '+_key};
  try{
    var r=await safeFetch(_url+'/rest/v1/orders?select=*&order_date=eq.'+today+'&order=created_at.desc',{method:'GET',headers:h});
    if(r.err||!r.ok){S.todayOrders=[];return;}
    var orders=JSON.parse(r.body||'[]');
    if(!Array.isArray(orders)||!orders.length){S.todayOrders=[];return;}
    var ids=orders.map(function(o){return o.id;}).join(',');
    var r2=await safeFetch(_url+'/rest/v1/order_items?select=*&order_id=in.('+ids+')',{method:'GET',headers:h});
    var items=(!r2.err&&r2.ok)?JSON.parse(r2.body||'[]'):[];
    // order_dateが一致するものだけを表示（JS側二重チェック）
    S.todayOrders=orders.filter(function(o){return o.order_date===today;}).map(function(o){
      return Object.assign({},o,{store_id:Number(o.store_id),id:Number(o.id),
        items:items.filter(function(i){return Number(i.order_id)===Number(o.id);})});
    });
  }catch(err){toast('データ取得エラー: '+safeMsg(err).split('\n')[0],true);S.todayOrders=[];}
}
async function fetchAdmin(){
  if(!isReady){S.adminOrders=[];return;}
  var h={'Content-Type':'application/json','apikey':_key,'Authorization':'Bearer '+_key};
  try{
    var f=S.af;
    var qs=['select=*','order=order_date.desc','limit=500'];
    if(f.from)qs.push('order_date=gte.'+f.from);
    if(f.to)qs.push('order_date=lte.'+f.to);
    if(f.sid)qs.push('store_id=eq.'+Number(f.sid));
    if(f.status)qs.push('status=eq.'+encodeURIComponent(f.status));
    var r=await safeFetch(_url+'/rest/v1/orders?'+qs.join('&'),{method:'GET',headers:h});
    if(r.err||!r.ok){S.adminOrders=[];return;}
    var orders=JSON.parse(r.body||'[]');
    if(!Array.isArray(orders)||!orders.length){S.adminOrders=[];return;}
    var ids=orders.map(function(o){return o.id;}).join(',');
    var r2=await safeFetch(_url+'/rest/v1/order_items?select=*&order_id=in.('+ids+')',{method:'GET',headers:h});
    var items=(!r2.err&&r2.ok)?JSON.parse(r2.body||'[]'):[];
    var res=orders.map(function(o){return Object.assign({},o,{store_id:Number(o.store_id),id:Number(o.id),items:items.filter(function(i){return Number(i.order_id)===Number(o.id);})});});
    if(f.kw){var kw=f.kw;res=res.filter(function(o){return(o.store_name||'').includes(kw)||(o.memo||'').includes(kw)||(o.items||[]).some(function(i){return i.product_name.includes(kw);});});}
    S.adminOrders=res;
  }catch(err){toast('読み込みエラー: '+safeMsg(err).split('\n')[0],true);S.adminOrders=[];}
}
async function fetchHist(){
  if(!isReady){S.histOrders=[];return;}
  var h={'Content-Type':'application/json','apikey':_key,'Authorization':'Bearer '+_key};
  try{
    var r=await safeFetch(_url+'/rest/v1/orders?select=*&order_date=lt.'+jst.iso+'&order=order_date.desc&limit=200',{method:'GET',headers:h});
    if(r.err||!r.ok){S.histOrders=[];return;}

    if(!Array.isArray(orders)||!orders.length){S.histOrders=[];return;}

    var r2=await safeFetch(_url+'/rest/v1/order_items?select=*&order_id=in.('+ids+')',{method:'GET',headers:h});
    var items=(!r2.err&&r2.ok)?JSON.parse(r2.body||'[]'):[];
    S.histOrders=orders.map(function(o){return Object.assign({},o,{store_id:Number(o.store_id),items:items.filter(function(i){return Number(i.order_id)===Number(o.id);})});});
  }catch(_){S.histOrders=[];}
}

function changeCkDate(d){
  S.ckDate=d;
  // 選択した日付のデータを取得（todayOrdersに含まれていない場合はfetch）
  var has=S.todayOrders.some(function(o){return o.order_date===d;});
  if(!has&&isReady){
    showL('発注データを取得中…');
    var h={'Content-Type':'application/json','apikey':_key,'Authorization':'Bearer '+_key};
    safeFetch(_url+'/rest/v1/orders?select=*&order_date=eq.'+d+'&order=created_at.desc',{method:'GET',headers:h}).then(function(r){
      if(r.err||!r.ok){hideL();render();return;}
      var orders=JSON.parse(r.body||'[]');
      if(!Array.isArray(orders)||!orders.length){hideL();render();return;}
      var ids=orders.map(function(o){return o.id;}).join(',');
      safeFetch(_url+'/rest/v1/order_items?select=*&order_id=in.('+ids+')',{method:'GET',headers:h}).then(function(r2){
        var items=(!r2.err&&r2.ok)?JSON.parse(r2.body||'[]'):[];
        orders.forEach(function(o){
          // order_dateが選択日と一致するものだけ追加（念のための二重チェック）
          if(o.order_date===d&&!S.todayOrders.find(function(x){return Number(x.id)===Number(o.id);})){
            S.todayOrders.push(Object.assign({},o,{store_id:Number(o.store_id),id:Number(o.id),items:items.filter(function(i){return Number(i.order_id)===Number(o.id);})}));
          }
        });
        hideL();render();
      });
    });
  }else{render();}
}

function renderModalHtml(){

function openProd(pid){
  pid=Number(pid)||0;
  // STORESが空ならデフォルト6店舗を使う
  var stores=STORES.length?STORES:[
    {id:1,name:'うどん屋たくあん',short_name:'うどん屋'},{id:2,name:'お弁当たくあん',short_name:'お弁当'},
    {id:3,name:'幸せや坂戸店',short_name:'幸せや坂戸'},{id:4,name:'幸せや今渡店',short_name:'幸せや今渡'},
    {id:5,name:'幸せや則武店',short_name:'幸せや則武'},{id:6,name:'アーラ店',short_name:'アーラ'}
  ];
  if(!STORES.length)STORES=stores;

  var p=pid?PRODUCTS.find(function(x){return Number(x.id)===pid;}):null;
  var psvEntry=pid?PSV[pid]:null;
  var visStores=(!pid||!psvEntry||!psvEntry.length)?STORES.map(function(s){return Number(s.id);}):psvEntry.slice();
  S.modal={type:'product',data:{p:p,visStores:visStores}};

  // 接続済みでCATSが空なら再取得してからモーダルを開く
  if(isReady&&!CATS.length){
    showL('カテゴリー情報を取得中…');
    loadMaster().then(function(){
      var pE=pid?PSV[pid]:null;
      S.modal.data.visStores=(!pid||!pE||!pE.length)?STORES.map(function(s){return Number(s.id);}):pE.slice();
      hideL();render();
    });
  }else{
    render();
  }
}

async function saveProd(pid){
  pid=Number(pid)||0; // 0=新規、正数=編集
  var nameEl=$('pm-name'),catEl=$('pm-cat'),unitEl=$('pm-unit');
  var errEl=$('pm-err');
  if(!nameEl||!catEl||!unitEl||!errEl){alert('フォームエラー。ページを再読み込みしてください。');return;}
  var name=(nameEl.value||'').trim();
  var catRaw=(catEl.value||'').trim(); // カテゴリーIDの文字列
  var unit=(unitEl.value||'').trim();
  var minQty=parseFloat(($('pm-min')?$('pm-min').value:1))||1;
  var dispOrd=parseInt(($('pm-ord')?$('pm-ord').value:10))||10;
  var memo=(($('pm-memo')?$('pm-memo').value:'')||'').trim();
  var freq=$('pm-freq')?$('pm-freq').checked:false;
  if(!name){errEl.innerHTML='<div class="al ae"><i class="ti ti-alert-circle"></i><span>商品名を入力してください</span></div>';return;}
  // カテゴリーは任意（空でも保存可能）
  if(!unit){errEl.innerHTML='<div class="al ae"><i class="ti ti-alert-circle"></i><span>単位を入力してください</span></div>';return;}
  // String比較でカテゴリーを検索（型不一致を防ぐ）。catRawが空の場合はカテゴリーなしで保存
  var cat=catRaw?CATS.find(function(c){return String(c.id)===String(catRaw);}):null;
  var catId=cat?Number(cat.id):(catRaw?Number(catRaw)||null:null);
  var catName=cat?cat.name:(catRaw||'');
  // 表示店舗（数値IDで保持）
  var visStores=[];
  document.querySelectorAll('[id^="pm-vis-"]').forEach(function(cb){if(cb.checked)visStores.push(Number(cb.dataset.sid||cb.id.replace('pm-vis-','')));});
  var payload={name:name,category_id:catId,category_name:catName,unit:unit,min_qty:minQty,display_order:dispOrd,memo:memo,is_frequent:freq,is_active:true};
  var btn=$('pm-save');if(btn)btn.disabled=true;
  errEl.innerHTML='<div class="cbox cif"><div class="sp spsm"></div><span>保存中…</span></div>';
  try{
    var savedId=pid;
    if(!isReady){
      // デモモード
      if(pid){var idx=PRODUCTS.findIndex(function(p){return Number(p.id)===pid;});if(idx>=0)PRODUCTS[idx]=Object.assign({},PRODUCTS[idx],payload);}
      else{var nid=Date.now();PRODUCTS.push(Object.assign({id:nid},payload));savedId=nid;}
      if(visStores.length)PSV[savedId]=visStores;else delete PSV[savedId];
    }else{
      if(pid){
        var r=await DB.from('products').update(Object.assign({},payload,{updated_at:new Date().toISOString()})).eq('id',pid);
        if(r.error)throw new Error(safeMsg(r.error));
        savedId=pid;
      }else{
        var r=await DB.from('products').insert(payload).select('*');
        if(r.error)throw new Error(safeMsg(r.error));
        if(!r.data||!r.data.length)throw new Error('商品の追加に失敗しました（IDが取得できません）');
        savedId=Number(r.data[0].id);
      }
      // PSV保存（既存削除→再挿入）
      var rd=await DB.from('product_store_visibility').delete().eq('product_id',savedId);
      if(visStores.length){
        var ri=await DB.from('product_store_visibility').insert(visStores.map(function(sid){return{product_id:savedId,store_id:sid,is_visible:true};}));
        if(ri.error)throw new Error('店舗別表示設定の保存失敗: '+safeMsg(ri.error));
      }
      await loadMaster();
    }
    S.modal=null;S.adminTab=0;
    toast(pid?'商品を更新しました':'商品を追加しました');render();
  }catch(err){
    if(btn)btn.disabled=false;
    if(errEl)errEl.innerHTML='<div class="al ae"><i class="ti ti-alert-circle"></i><span>'+esc(safeMsg(err))+'</span></div>';
  }
}

async function saveSP(sid){
  sid=Number(sid);
  var errEl=$('spm-err');
  var sel=[];document.querySelectorAll('.sp-vis').forEach(function(cb){if(cb.checked)sel.push(Number(cb.dataset.pid));});
  if(!isReady){
    // デモモード: 選択店舗のPSVを更新
    PRODUCTS.filter(function(p){return p.is_active!==false;}).forEach(function(p){
      var pid=Number(p.id);
      var cur=(PSV[pid]||STORES.map(function(s){return Number(s.id);})).slice();
      if(sel.indexOf(pid)>=0){if(cur.indexOf(sid)<0)cur.push(sid);}
      else{var i=cur.indexOf(sid);if(i>=0)cur.splice(i,1);}
      PSV[pid]=cur;
    });
    S.modal=null;S.adminTab=3;toast((STORES.find(function(s){return Number(s.id)===sid;})||{name:''}).name+'の設定を保存しました');render();return;
  }
  try{
    // この店舗のPSVを全削除→再挿入
    var rd=await DB.from('product_store_visibility').delete().eq('store_id',sid);
    if(sel.length){
      var ri=await DB.from('product_store_visibility').insert(sel.map(function(pid){return{product_id:pid,store_id:sid,is_visible:true};}));
      if(ri.error)throw new Error(safeMsg(ri.error));
    }
    await loadMaster();
    S.modal=null;S.adminTab=3;toast((STORES.find(function(s){return Number(s.id)===sid;})||{name:''}).name+'の設定を保存しました');render();
  }catch(err){if(errEl)errEl.innerHTML='<div class="al ae"><i class="ti ti-alert-circle"></i><span>'+esc(safeMsg(err))+'</span></div>';}
}

async function doSub(){
  if(S.submitting)return;S.submitting=true;
  var btn=$('sub');if(btn)btn.disabled=true;
  var od=getOrderDate();
  var items=PRODUCTS.filter(function(p){return(S.qty[Number(p.id)]||0)>0;}).map(function(p){
    return{product_id:Number(p.id),product_name:p.name,quantity:S.qty[Number(p.id)],unit:p.unit};
  });
  var late=isLate()&&od===jst.iso;
  var st=getStore();
  // 同日重複チェック
  var existing=S.todayOrders.find(function(o){return Number(o.store_id)===Number(S.storeId)&&o.order_date===od&&o.status!=='no_order';});
  if(existing){
    S.submitting=false;if(btn)btn.disabled=false;
    if(!confirm('【'+getOrderDateDisp(od)+'】の発注はすでに送信されています。\n上書きして再送信しますか？\n（既存の発注は削除されます）')){render();return;}
    // 既存発注を削除
    if(isReady&&typeof existing.id==='number'){
      await DB.from('order_items').delete().eq('order_id',existing.id);
      await DB.from('orders').delete().eq('id',existing.id);
    }
    S.todayOrders=S.todayOrders.filter(function(o){return!(Number(o.store_id)===Number(S.storeId)&&o.order_date===od);});
    S.submitting=true;
  }
  showL('発注をCKに送信中…');
  var pl={store_id:Number(S.storeId),store_name:st.name||('店舗'+S.storeId),order_date:od,status:late?'late':'ordered',memo:S.memo||'',is_late:late,created_by:st.manager_name||'店長'};
  try{
    if(!isReady){
      var d=Object.assign({id:Date.now()},pl,{created_at:new Date().toISOString(),items:items.map(function(i){return{product_name:i.product_name,quantity:i.quantity,unit:i.unit};})});
      S.todayOrders.push(d);
    }else{
      var ro=await DB.from('orders').insert(pl).select('*');
      if(ro.error)throw new Error(safeMsg(ro.error));
      if(!ro.data||!ro.data.length)throw new Error('発注レコードの保存に失敗しました');
      var oid=Number(ro.data[0].id);
      if(items.length){
        var ri=await DB.from('order_items').insert(items.map(function(i){return Object.assign({},i,{order_id:oid});}));
        if(ri.error)throw new Error(safeMsg(ri.error));
      }
      S.todayOrders.push(Object.assign({},ro.data[0],{store_id:Number(ro.data[0].store_id),id:oid,items:items.map(function(i){return{product_name:i.product_name,quantity:i.quantity,unit:i.unit};})}));
    }
    // 成功後：数量・メモをリセット、日付は維持して連続発注できるようにする
    hideL();S.submitting=false;S.qty={};S.memo='';S.phase='success';render();
  }catch(err){
    hideL();S.submitting=false;if(btn)btn.disabled=false;
    toast('発注の送信に失敗しました。通信環境を確認してもう一度送信してください。（'+safeMsg(err)+'）',true);
    render();
  }
}

  var rows=[['発注日','店舗名','商品名','数量','単位','ステータス','締切後','メモ','発注時間','CK確認','出荷']];
  S.adminOrders.forEach(function(o){
    var t=new Date(o.created_at).toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'});
    var sl=sMeta(o.status).l,ck=o.status==='ck_confirmed'||o.status==='shipped'?'済':'未',sh=o.status==='shipped'?'済':'未';
    if(!o.items||!o.items.length)rows.push([o.order_date,o.store_name,'（発注なし）','','',sl,o.is_late?'はい':'いいえ',o.memo||'',t,ck,sh]);
    else o.items.forEach(function(i){rows.push([o.order_date,o.store_name,i.product_name,i.quantity,i.unit,sl,o.is_late?'はい':'いいえ',o.memo||'',t,ck,sh]);});
  });
  var csv='\uFEFF'+rows.map(function(r){return r.map(function(v){return'"'+String(v||'').replace(/"/g,'""')+'"';}).join(',');}).join('\r\n');
  var url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  var a=document.createElement('a');a.href=url;a.download='発注履歴_'+jst.iso+'.csv';a.click();
  URL.revokeObjectURL(url);toast('CSVをダウンロードしました（'+rows.length+'行）');
}

/* ======== 起動処理 ======== */
(async function boot(){
  // localStorageは使わない。SB_URLとSB_KEYのみ使用。
  var u=(SB_URL||'').replace(/[\s\r\n]/g,'');
  var k=(SB_KEY||'').replace(/[\s\r\n]/g,'');
  startDW();
  if(u&&k){
    showL('接続中…');
    var r=await initSB(u,k);
    hideL();
    S.connErr=r.ok?'':(r.msg||'接続失敗');
  }else{
    S.connErr='SB_KEYが設定されていません。\nindex.htmlの137行目にAnon Keyを貼り付けてVercelに再デプロイしてください。';
  }
  // 接続成功・失敗に関わらず常にlogin画面を表示
  S.view='login';
  render();
})();

</script>
